name = "saturday-chat"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# --- The one deployment: static site + API, same origin --------------------
# public/  serves the chat app at / and the admin panel at /admin/
# src/     serves the API at /api/* (run_worker_first forces those paths
#          through the Worker; everything else is answered by the asset layer,
#          which is free and doesn't count against your Worker request quota).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# --- Free-tier storage -------------------------------------------------------
# KV holds the model registry, health records and rate-limit counters.
# No payment method required for KV or D1 — both are on the free plan.
[[kv_namespaces]]
binding = "REGISTRY"
id = "18f0fe2dfcad43c2a27c86a423aa1189"

# D1 holds conversations, users, admin config and audit rows.
[[d1_databases]]
binding = "DB"
database_name = "saturday"
database_id = "a16e2dbf-0ee2-44b6-9607-608adcbfd227"

# Workers AI — free allocation, used as a provider and as a fallback.
[ai]
binding = "AI"

[triggers]
# Hourly probe sweep. Every cron run spends KV writes (catalog + health records),
# and the free plan caps those at 1,000/day shared with rate-limit counters —
# hourly keeps the catalogue warm without squeezing the request path's budget.
# (Real generations feed the health system too, so an active site stays fresh.)
crons = ["7 * * * *"]

[vars]
# Same-origin by default: the site and API are one deployment, so the browser
# never makes a cross-origin request. This list now only matters if you call
# the API from a client hosted on a different domain — add its origin here.
ALLOWED_ORIGINS = "http://localhost:5173"
HEALTH_TTL_SECONDS = "900"
HEALTH_PROBE_BUDGET = "12"

# Secrets — set in the dashboard (Workers & Pages → your Worker → Settings →
# Variables and Secrets) or with `wrangler secret put <NAME>`, never in here:
#   NVIDIA_NIM_API_KEY
#   OPENROUTER_API_KEY
#   CLOUDFLARE_API_KEY        (optional — the [ai] binding usually covers it)
#   CLOUDFLARE_ACCOUNT_ID     (optional — same)
#   ADMIN_TOKEN_SECRET     a long random string; signs admin bearer tokens
#   ADMIN_PASSWORD         the password the admin panel's login screen checks
