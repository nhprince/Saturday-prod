/* ---------- health ---------- */
const HEALTH_TTL = 10 * 60 * 1000;
const Health = {
  map: LS.get('health', {}),
  get(id) {
    const h = this.map[id] || (this.map[id] = { status: 'unknown', failures: 0, latencyMs: null, lastCheckedAt: null, cooldownUntil: 0, note: '' });
    if (h.status === 'available' && h.lastCheckedAt && Date.now() - h.lastCheckedAt > HEALTH_TTL) h.status = 'unknown';
    return h;
  },
  save: debounce(function () { LS.set('health', Health.map); }, 400),
  set(id, patch) {
    const h = this.get(id);
    Object.assign(h, patch, { lastCheckedAt: Date.now() });
    this.save(); if (typeof UI !== "undefined") UI.refreshModelIndicators();
    return h;
  },
  success(id, latencyMs) {
    const h = this.get(id);
    const prev = h.latencyMs;
    this.set(id, {
      status: 'available', failures: 0, cooldownUntil: 0, note: '',
      latencyMs: prev ? Math.round(prev * 0.6 + latencyMs * 0.4) : latencyMs,
    });
  },
  failure(id, code) {
    const h = this.get(id);
    const fails = h.failures + 1;
    const map = {
      rate_limited: ['degraded', 'Rate limited', 60e3],
      upstream_error: ['degraded', 'Upstream error', 20e3],
      session_expired: ['unavailable', 'Sign-in required', 0],
      not_granted: ['unavailable', 'Not permitted for this view', 0],
      sampling_disabled: ['unavailable', 'Disabled for this account', 0],
      not_declared: ['unavailable', 'Capability not declared', 0],
      capability_disabled: ['unavailable', 'Unavailable in this view', 0],
      prompt_too_large: ['degraded', 'Context exceeded', 0],
      empty_completion: ['degraded', 'Empty completion', 5e3],
      refused: ['available', '', 0],
      invalid_json: ['available', '', 0],
    };
    const [status, note, base] = map[code] || ['degraded', 'Error', 15e3];
    const backoff = base ? Math.min(base * Math.pow(2, fails - 1), 15 * 60e3) : 0;
    this.set(id, { status, failures: code === 'refused' ? h.failures : fails, note, cooldownUntil: backoff ? Date.now() + backoff : 0 });
  },
  eligible(id) {
    const h = this.get(id);
    if (h.status === 'unavailable') return false;
    if (h.cooldownUntil && Date.now() < h.cooldownUntil) return false;
    return true;
  },
  /* A real probe: it spends a little of the viewer's usage, so it is only ever
     run from an explicit action, never on load or on a timer. */
  async probe(model) {
    const p = Providers[model.provider];
    if (p?.remote) {
      // The backend already health-checks its own models (cron + admin panel);
      // a manual recheck here just re-fetches that verdict rather than spending
      // another generation on it.
      this.set(model.id, { status: 'checking' });
      await Registry.refreshRemote();
      return;
    }
    if (!p?.sample) { this.set(model.id, { status: 'unavailable', note: 'Provider not configured here' }); return; }
    this.set(model.id, { status: 'checking' });
    const t0 = performance.now();
    try {
      await p.sample('Reply with the single word: ready.', { modelTier: model.tier, cache: { gcTime: HEALTH_TTL } });
      this.success(model.id, Math.round(performance.now() - t0));
    } catch (e) { this.failure(model.id, e?.code || 'upstream_error'); }
  },
};

/* ---------- registry ---------- */
const Registry = {
  models: [],
  remoteReachable: false,
  async discover() {
    const live = await Providers['saturday-runtime'].init();

    // Remote providers all share one catalogue call and one enable/disable switch.
    this.remoteReachable = false;
    if (Remote.isConfigured()) {
      const rows = await Remote.catalog();
      this.remoteReachable = rows.length > 0 || (await Remote.ping());
      const byProvider = { 'nvidia-nim': [], cloudflare: [], openrouter: [] };
      for (const raw of rows) if (byProvider[raw.provider]) byProvider[raw.provider].push(Remote.mapModel(raw));
      for (const id of Object.keys(byProvider)) {
        const p = Providers[id];
        p._models = byProvider[id];
        p.sample = byProvider[id].length ? Remote.makeSample(id) : null;
        for (const m of byProvider[id]) {
          Health.set(m.id, {
            status: m.remoteStatus === 'unavailable' ? 'unavailable' : m.remoteStatus,
            // don't clobber a locally measured latency when the backend has none
            ...(m.remoteLatency != null ? { latencyMs: m.remoteLatency } : {}),
            note: m.remoteStatus === 'unavailable' ? 'Reported unavailable by the backend' : '',
          });
        }
      }
    } else {
      for (const id of ['nvidia-nim', 'cloudflare', 'openrouter']) { Providers[id]._models = []; Providers[id].sample = null; }
    }

    this.models = [];
    for (const p of Object.values(Providers)) {
      const list = p.listModels ? p.listModels() : [];
      for (const m of list) this.models.push(m);
    }
    if (live) for (const m of this.models) if (m.provider === 'saturday-runtime' && Health.get(m.id).status === 'unknown') Health.set(m.id, { status: 'available', note: 'Runtime reachable' });
    return this.models;
  },
  /** Re-pulls the remote catalogue without a full re-discovery — used by the manual "recheck". */
  async refreshRemote() {
    if (!Remote.isConfigured()) return;
    await Remote.catalog(true);
    await this.discover();
  },
  byId(id) { return this.models.find((m) => m.id === id) || null; },
  routerById(id) { return ROUTERS.find((r) => r.id === id) || null; },
  entry(id) { return this.routerById(id) || this.byId(id); },
  /* The set the router may pick from — same rule as eligible(): anything not
     explicitly broken or cooling down counts, including not-yet-probed models. */
  available() { return this.models.filter((m) => Health.eligible(m.id)); },
  eligible(req) {
    return this.models.filter((m) => {
      if (!Health.eligible(m.id)) return false;
      if (req.vision && !m.capabilities.vision) return false;
      if (req.json && !m.capabilities.json) return false;
      if (req.reasoning && !m.capabilities.reasoning) return false;
      if (req.contextChars && m.contextWindow && req.contextChars > m.contextWindow) return false;
      return true;
    });
  },
  label(id) { const e = this.entry(id); return e ? e.displayName : 'Select a model'; },
  statusOf(id) {
    const r = this.routerById(id);
    if (r) {
      const pool = this.models.filter((m) => Health.eligible(m.id));
      return pool.length ? 'available' : 'unavailable';
    }
    return Health.get(id).status;
  },
};

/* ---------- task classification (local, deterministic) ---------- */
function classify(text, attachments) {
  const t = (text || '').toLowerCase();
  const signals = [];
  const hasImage = attachments.some((a) => a.kind === 'image');
  if (hasImage) signals.push('image attached');

  const code = /```|\b(function|class |def |const |let |import |npm |pip |regex|refactor|stack ?trace|compile|typescript|javascript|python|rust|golang|sql query|api endpoint|unit test|bug)\b/.test(t)
    || attachments.some((a) => a.kind === 'code');
  if (code) signals.push('code');

  const math = /\$\$|\\frac|\\sum|\\int|\b(integral|derivative|theorem|prove|proof|equation|solve for|matrix|eigen)\b/.test(t);
  if (math) signals.push('mathematics');

  const reason = /\b(why|analy[sz]e|analysis|compare|trade-?offs?|strategy|architect|design a|plan|evaluate|critique|implications|step by step|reason)\b/.test(t) || (text || '').length > 700;
  if (reason) signals.push('reasoning');

  const json = /\bjson\b|\bschema\b|structured output|csv output|yaml/.test(t);
  if (json) signals.push('structured output');

  const contextChars = (text || '').length + attachments.reduce((n, a) => n + (a.text?.length || 0), 0);
  if (contextChars > 6000) signals.push('long context');

  const short = (text || '').length < 140 && !code && !math && !reason && !json && !hasImage;
  if (short) signals.push('short turn');

  const requires = { vision: hasImage, json, reasoning: reason || math || (code && contextChars > 1200), contextChars };
  const want = hasImage ? 'default'
    : (math || reason || (code && contextChars > 1500)) ? 'complex'
    : short ? 'quick' : 'default';
  return { signals, requires, want, contextChars };
}

/* ---------- routers ---------- */
const Router = {
  /* Returns a RoutingDecision: which model, why, and what else was eligible. */
  decide(selectedId, text, attachments) {
    const cls = classify(text, attachments);
    const router = Registry.routerById(selectedId);
    if (!router) {
      const m = Registry.byId(selectedId);
      if (m && Health.eligible(m.id)) {
        return { mode: 'manual', model: m, signals: cls.signals, reason: 'Chosen by you', candidates: [m.id], cls };
      }
      // selected model is not usable — fall through to smart routing, and say so
      const alt = this.pick('smart', cls);
      return { mode: 'smart', model: alt.model, signals: cls.signals, candidates: alt.candidates, cls,
        reason: m ? `${m.displayName} is ${Health.get(m.id).status}; routed to an available model` : 'No model selected; routed automatically' };
    }
    const r = this.pick(router.router, cls);
    return { mode: router.router, model: r.model, signals: cls.signals, candidates: r.candidates, cls, reason: r.reason };
  },
  pick(mode, cls) {
    const pool = Registry.eligible(cls.requires);
    const candidates = pool.map((m) => m.id);
    if (!pool.length) return { model: null, candidates, reason: 'No eligible model' };
    if (mode === 'free') {
      const m = [...pool].sort((a, b) => a.weight - b.weight)[0];
      return { model: m, candidates, reason: 'Lowest-cost model that meets the requirements' };
    }
    const order = { quick: ['quick', 'default', 'complex'], default: ['default', 'complex', 'quick'], complex: ['complex', 'default', 'quick'] }[cls.want];
    for (const tier of order) {
      const m = pool.find((x) => x.tier === tier);
      if (m) return { model: m, candidates, reason: cls.signals.length ? `Matched: ${cls.signals.join(', ')}` : 'General request' };
    }
    return { model: pool[0], candidates, reason: 'First eligible model' };
  },
  /* Next model to try after a failure, honouring capability requirements. */
  fallback(decision, triedIds) {
    if (!State.settings.autoFallback) return null;
    const pool = Registry.eligible(decision.cls.requires).filter((m) => !triedIds.includes(m.id));
    if (!pool.length) return null;
    const order = { quick: 1, default: 2, complex: 3 };
    return pool.sort((a, b) => Math.abs(order[a.tier] - order[decision.cls.want === 'quick' ? 1 : decision.cls.want === 'default' ? 2 : 3])
      - Math.abs(order[b.tier] - order[decision.cls.want === 'quick' ? 1 : 2]))[0];
  },
};

const FATAL = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired', 'refused', 'cancelled', 'invalid_request', 'prompt_too_large', 'image_rejected', 'images_unavailable']);

const ERROR_COPY = {
  not_granted: ['Saturday needs your permission', 'This page was not allowed to use your Claude account, so it cannot generate a reply.'],
  sampling_disabled: ['Model access unavailable', 'Your account or organization does not currently have model access enabled.'],
  session_expired: ['Session expired', 'Sign in to Claude again, then resend the message.'],
  rate_limited: ['Rate limit reached', 'Too many requests for now. Wait a moment and try again — routing will avoid this model in the meantime.'],
  refused: ['Request declined', 'The model declined this input. Rephrasing or narrowing the request usually helps.'],
  empty_completion: ['No response produced', 'The model returned nothing. Try asking for less at a time.'],
  prompt_too_large: ['Conversation too long', 'This request exceeds the context limit. Start a new chat or remove an attachment.'],
  image_rejected: ['Image not accepted', 'The file was too large or not a supported image type.'],
  images_unavailable: ['Images unavailable', 'This view cannot send images. Remove the image attachment to continue.'],
  invalid_json: ['Unreadable structured output', 'The model did not return valid JSON.'],
  upstream_error: ['Connection interrupted', 'The request failed partway through. You can retry it.'],
  no_model: ['No compatible model available', 'Every eligible model is currently unavailable or cooling down. Try again shortly, or pick a model manually.'],
};

/* ---------- chat pipeline ---------- */
const Chat = {
  attCache: new Map(),   // msgId -> attachments (blobs stay out of persisted state)

  buildTurns(conv, userText, attachments) {
    const turns = [{ role: 'user', content: SATURDAY_SYSTEM }];
    const history = conv.messages.filter((m) => !m.error && m.content);
    const body = [];
    for (const m of history) body.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content });

    let extra = '';
    for (const a of attachments) {
      if (a.kind === 'image') extra += `\n\n[Image attached: ${a.name}]`;
      else if (a.text) extra += `\n\n--- ${a.name} ---\n\`\`\`${a.lang || ''}\n${a.text}\n\`\`\``;
      else extra += `\n\n[Attached: ${a.name} (${fmtBytes(a.size)}) — content could not be read as text]`;
    }
    const last = { role: 'user', content: (userText || '(see attachment)') + extra };

    // Keep the instruction turn; drop the oldest history until we fit the byte cap.
    const bytes = (s) => new TextEncoder().encode(s).length;
    let total = bytes(turns[0].content) + bytes(last.content) + body.reduce((n, t) => n + bytes(t.content), 0);
    const CAP = 60000;
    while (total > CAP && body.length) total -= bytes(body.shift().content);
    return [...turns, ...body, last];
  },

  async send(text, attachments) {
    let conv = State.active || State.newConversation();
    const userMsg = {
      id: uid('m'), role: 'user', content: text, createdAt: Date.now(),
      attachments: attachments.map((a) => ({ name: a.name, size: a.size, kind: a.kind, url: a.url })),
    };
    conv.messages.push(userMsg);
    if (conv.messages.length === 1) conv.title = text.replace(/\s+/g, ' ').trim().slice(0, 52) || 'New chat';
    State.touch(conv);
    UI.renderRail(); UI.setTitle();
    UI.appendMessage(userMsg);

    const assistant = { id: uid('m'), role: 'assistant', content: '', createdAt: Date.now(), state: 'thinking', routing: null };
    conv.messages.push(assistant);
    UI.appendMessage(assistant);
    UI.scrollToEnd(true);

    await this.run(conv, assistant, attachments);
  },

  async run(conv, assistant, attachments) {
    const userTurn = [...conv.messages].reverse().find((m) => m.role === 'user');
    const history = conv.messages.slice(0, conv.messages.indexOf(assistant) - 1);
    if (attachments?.length) this.attCache.set(assistant.id, attachments);
    const decision = Router.decide(State.modelId, userTurn?.content || '', attachments);

    if (!decision.model) {
      this.fail(conv, assistant, { code: 'no_model' }, attachments);
      return;
    }

    const tried = [];
    let model = decision.model;
    for (let attempt = 0; attempt < 3; attempt++) {
      tried.push(model.id);
      assistant.routing = {
        mode: decision.mode, modelId: model.id, modelName: model.displayName,
        provider: Providers[model.provider].name, signals: decision.signals,
        reason: attempt === 0 ? decision.reason : `Fell back after ${tried[attempt - 1]} failed`,
        candidates: decision.candidates, fallbackFrom: attempt ? tried[attempt - 1] : null,
      };
      UI.updateMessage(assistant);

      const result = await this.stream(conv, assistant, model, attachments, history);
      if (result.ok) {
        State.touch(conv);
        // Mirror the finished exchange to the Saturday API, if one is configured.
        const uMsg = [...conv.messages].reverse().find((m) => m.role === 'user' && m.createdAt <= assistant.createdAt);
        Remote.syncEnsure(conv).then((rid) => rid && Remote.syncMessages(conv, [uMsg, assistant]));
        return;
      }
      const code = result.code || 'upstream_error';
      Health.failure(model.id, code);
      if (code === 'cancelled') { assistant.state = 'stopped'; UI.updateMessage(assistant); State.touch(conv); return; }
      if (FATAL.has(code) || !State.settings.autoFallback) { this.fail(conv, assistant, result, attachments); return; }
      const next = Router.fallback(decision, tried);
      if (!next) { this.fail(conv, assistant, result, attachments); return; }
      assistant.content = '';
      model = next;
      UI.toast(`${Registry.label(tried[tried.length - 1])} failed — retrying on ${next.displayName}`, 'info');
    }
    this.fail(conv, assistant, { code: 'upstream_error' }, attachments);
  },

  async stream(conv, assistant, model, attachments, history) {
    const provider = Providers[model.provider];
    if (!provider?.sample) return { ok: false, code: 'not_declared' };

    const ctl = new AbortController();
    State.streaming = { abort: () => ctl.abort(), convId: conv.id, msgId: assistant.id };
    UI.setSendMode('stop');

    const userText = [...conv.messages].reverse().find((m) => m.role === 'user')?.content || '';
    const turns = this.buildTurns({ messages: history }, userText, attachments);
    const imageBlobs = attachments.filter((a) => a.kind === 'image' && a.blob).map((a) => a.blob);

    const t0 = performance.now();
    let firstToken = 0;
    let paint = null, lastPaint = 0;
    let routedModelId = model.id;   // the backend may fall back mid-stream; track who actually answers

    const opts = {
      modelTier: model.tier, modelId: model.id, cache: false, signal: ctl.signal,
      onText: ({ text }) => {
        if (!firstToken) {
          firstToken = performance.now() - t0;
          assistant.state = 'writing';
        }
        assistant.content = text;
        // repaint ~11x/s at most: markdown is re-parsed on each paint
        if (!paint && performance.now() - lastPaint > 90) {
          paint = requestAnimationFrame(() => { paint = null; lastPaint = performance.now(); UI.updateMessage(assistant); });
        }
      },
      onRouting: (r) => {
        // The backend fell back to a different model. The badge must show the model
        // that is actually answering — not the one that was requested and failed.
        if (!r || !r.modelId || r.modelId === model.id) return;
        routedModelId = r.modelId;
        const actual = Registry.byId(r.modelId);
        assistant.routing = {
          ...(assistant.routing || {}),
          modelId: r.modelId,
          modelName: actual?.displayName || r.modelId.split(':').pop(),
          provider: Providers[r.provider]?.name || r.provider,
          reason: r.reason || `Fell back after ${r.fallbackFrom || model.id} failed`,
          fallbackFrom: r.fallbackFrom || assistant.routing?.fallbackFrom || null,
        };
        UI.toast(`${Registry.label(r.fallbackFrom || model.id)} failed — retrying on ${assistant.routing.modelName}`, 'info');
        UI.updateMessage(assistant);
      },
    };
    if (imageBlobs.length) {
      if (provider.remote) opts.imageUrls = await Promise.all(imageBlobs.slice(0, 4).map(blobToDataURL));
      else if (provider.limits?.images) opts.images = imageBlobs.slice(0, provider.limits.images.maxCount);
    }

    try {
      const res = await provider.sample(turns, opts);
      if (paint) cancelAnimationFrame(paint);
      assistant.content = res.text;
      assistant.truncated = res.truncated;
      assistant.state = 'done';
      assistant.error = null;
      assistant.latencyMs = Math.round(firstToken || performance.now() - t0);
      if (routedModelId !== model.id) {
        // The requested model failed upstream and the backend fell back: record both
        // truths locally, so this client's own router avoids the broken one next time.
        Health.failure(model.id, 'upstream_error');
        Health.success(routedModelId, assistant.latencyMs);
      } else {
        Health.success(model.id, assistant.latencyMs);
      }
      UI.updateMessage(assistant);
      return { ok: true };
    } catch (e) {
      if (paint) cancelAnimationFrame(paint);
      if (typeof e?.text === 'string' && e.text) assistant.content = e.text;
      return { ok: false, code: e?.code || 'upstream_error', message: e?.message };
    } finally {
      State.streaming = null;
      UI.setSendMode('send');
    }
  },

  fail(conv, assistant, result, attachments) {
    const [title, detail] = ERROR_COPY[result.code] || ERROR_COPY.upstream_error;
    assistant.state = 'error';
    assistant.error = { code: result.code, title, detail, retryable: !['not_granted', 'sampling_disabled', 'not_declared'].includes(result.code) };
    UI.updateMessage(assistant);
    State.touch(conv);
  },

  stop() { State.streaming?.abort(); },

  async regenerate(msgId) {
    const conv = State.active; if (!conv) return;
    const idx = conv.messages.findIndex((m) => m.id === msgId);
    if (idx < 0) return;
    const assistant = conv.messages[idx];
    assistant.content = ''; assistant.error = null; assistant.state = 'thinking';
    conv.messages = conv.messages.slice(0, idx + 1);
    UI.renderThread();
    await this.run(conv, assistant, this.attCache.get(msgId) || []);
  },
};
/* ============================================================
   SATURDAY — UI
   ============================================================ */
const UI = {
  toast,
  pop: null,

  /* ---------------- sidebar ---------------- */
  renderRail() {
    const list = $('#railList');
    const convs = State.conversations.filter((c) => !c.archived);
    const pinned = convs.filter((c) => c.pinned);
    const rest = convs.filter((c) => !c.pinned);
    const archived = State.conversations.filter((c) => c.archived);

    const group = (label, items, extra = '') => items.length
      ? `<div class="rail-group"><span>${label}</span>${extra}</div>` + items.map((c) => this.convHTML(c)).join('')
      : '';

    const now = Date.now();
    const recent = rest.filter((c) => now - c.updatedAt < 86400e3);
    const older = rest.filter((c) => now - c.updatedAt >= 86400e3);

    list.innerHTML =
      group('Pinned', pinned) +
      group('Today', recent) +
      group('Earlier', older) +
      (archived.length ? `<div class="rail-group"><span>Archived · ${archived.length}</span></div>` + archived.map((c) => this.convHTML(c)).join('') : '') +
      (!State.conversations.length ? '<div class="empty-note">No conversations yet.<br>Start one below.</div>' : '');
  },

  convHTML(c) {
    return `<div class="conv" role="button" tabindex="0" data-conv="${c.id}" aria-current="${c.id === State.activeId}">
      ${c.pinned ? svg('pin', 'pin') : ''}
      <span class="conv-title">${esc(c.title)}</span>
      <button class="icon-btn sm more" data-conv-menu="${c.id}" aria-label="Options for ${esc(c.title)}">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button></div>`;
  },

  /* ---------------- thread ---------------- */
  setTitle() {
    const c = State.active;
    const name = (typeof Brand !== 'undefined' && Brand.name) || 'Saturday';
    $('#convTitle').textContent = c ? c.title : name;
    document.title = c ? `${c.title} · ${name}` : name;
  },

  renderThread() {
    const thread = $('#thread');
    const c = State.active;
    thread.classList.toggle('compact', State.settings.compact);
    if (!c || !c.messages.length) { this.renderWelcome(); this.setTitle(); return; }
    thread.innerHTML = c.messages.map((m) => this.messageHTML(m)).join('');
    this.setTitle();
    requestAnimationFrame(() => this.scrollToEnd(false));
  },

  renderWelcome() {
    const heading = (typeof Brand !== 'undefined' && Brand.welcomeHeading) || 'Saturday';
    const sub = (typeof Brand !== 'undefined' && Brand.welcomeSubheading) || 'What are we working on today?';
    const sugg = (typeof Brand !== 'undefined' && Brand.suggestions?.length) ? Brand.suggestions : [
      'Help me plan my week.',
      'Explain something difficult.',
      'Write something for me.',
      'Help me build an idea.',
    ];
    $('#thread').innerHTML = `<div class="welcome">
      <h1>${esc(heading)}</h1>
      <p>${esc(sub)}</p>
      <div class="sugg">${sugg.map((s) => `<button type="button" data-sugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    </div>`;
  },

  appendMessage(m) {
    const thread = $('#thread');
    if ($('.welcome', thread)) thread.innerHTML = '';
    thread.insertAdjacentHTML('beforeend', this.messageHTML(m));
  },

  updateMessage(m) {
    const el = $(`[data-msg="${m.id}"]`);
    if (!el) return;
    const stick = this.isAtBottom();
    el.outerHTML = this.messageHTML(m);
    if (stick) this.scrollToEnd(false);
  },

  messageHTML(m) {
    if (m.role === 'user') {
      const atts = (m.attachments || []).length
        ? `<div class="att-row">${m.attachments.map((a) => this.attHTML(a)).join('')}</div>` : '';
      const ts = State.settings.timestamps ? `<div class="msg-meta" style="justify-content:flex-end;margin:6px 0 0">${fmtWhen(m.createdAt)}</div>` : '';
      return `<article class="msg msg-user" data-msg="${m.id}">${atts}
        <div class="bubble">${esc(m.content)}</div>${ts}
        <div class="msg-actions">
          <button class="icon-btn sm" data-copy="${m.id}" aria-label="Copy message">${svg('copy')}</button>
          <button class="icon-btn sm" data-edit="${m.id}" aria-label="Edit and resend">${svg('edit')}</button>
        </div></article>`;
    }

    const r = m.routing;
    const routeChip = (r && State.settings.showRouting)
      ? `<button class="route" data-route="${m.id}" aria-label="Routing details">
           ${r.mode === 'manual' ? '' : svg('route', 'route-ic') }
           ${esc(r.mode === 'smart' ? 'Smart Router' : r.mode === 'free' ? 'Free Router' : r.modelName)}${r.mode === 'manual' ? '' : ' · ' + esc(r.modelName)}
         </button>` : '';

    let body;
    if (m.state === 'thinking') {
      body = `<div class="state"><span class="bar"><i></i><i></i><i></i></span>Thinking</div>`;
    } else if (m.state === 'error' && !m.content) {
      body = this.errorHTML(m);
    } else {
      const html = m.state === 'writing' ? markdownStreaming(m.content) : markdown(m.content);
      body = `<div class="prose">${html}${m.state === 'writing' ? '<span class="caret"></span>' : ''}</div>`
        + (m.truncated ? `<div class="msg-meta" style="margin:10px 0 0">Response hit the length limit — ask for the rest and it will continue.</div>` : '')
        + (m.state === 'stopped' ? `<div class="msg-meta" style="margin:10px 0 0">Stopped</div>` : '')
        + (m.state === 'error' ? this.errorHTML(m) : '');
    }

    const meta = (routeChip || m.state === 'writing')
      ? `<div class="msg-meta">${routeChip}${m.state === 'writing' ? `<span class="state"><span class="bar"><i></i><i></i><i></i></span>Writing</span>` : ''}${State.settings.timestamps && m.state === 'done' ? `<span>${fmtWhen(m.createdAt)}</span>` : ''}</div>`
      : '';

    const actions = (m.state === 'done' || m.state === 'stopped')
      ? `<div class="msg-actions">
          <button class="icon-btn sm" data-copy="${m.id}" aria-label="Copy response">${svg('copy')}</button>
          <button class="icon-btn sm" data-regen="${m.id}" aria-label="Regenerate">${svg('refresh')}</button>
        </div>` : '';

    return `<article class="msg msg-assistant" data-msg="${m.id}">${meta}${body}${actions}</article>`;
  },

  errorHTML(m) {
    const e = m.error || {};
    return `<div class="err-card" style="${m.content ? 'margin-top:12px' : ''}">${svg('alert')}
      <div class="b"><b>${esc(e.title || 'Something went wrong')}</b>
      <p>${esc(e.detail || '')}</p>
      <div class="acts">
        ${e.retryable ? `<button class="btn" data-regen="${m.id}">${svg('refresh')}Retry</button>` : ''}
        <button class="btn" data-open-models="1">Choose a model</button>
      </div></div></div>`;
  },

  attHTML(a) {
    const thumb = a.kind === 'image' && a.url ? `<img src="${a.url}" alt="">` : svg(a.kind === 'image' ? 'image' : 'file');
    return `<span class="att">${thumb}<b>${esc(a.name)}</b><i>${fmtBytes(a.size)}</i></span>`;
  },

  /* ---------------- scroll ---------------- */
  isAtBottom() {
    const s = $('#scroll');
    return s.scrollHeight - s.scrollTop - s.clientHeight < 90;
  },
  scrollToEnd(smooth) {
    const s = $('#scroll');
    s.scrollTo({ top: s.scrollHeight, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
  },

  setSendMode(mode) {
    const b = $('#send');
    b.dataset.mode = mode;
    b.disabled = mode === 'stop' ? false : !($('#input').value.trim() || State.attachments.length);
    b.setAttribute('aria-label', mode === 'stop' ? 'Stop generating' : 'Send message');
    b.innerHTML = mode === 'stop'
      ? `<svg viewBox="0 0 24 24">${ICON.stop}</svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
  },

  refreshModelIndicators() {
    const id = State.modelId;
    const label = Registry.label(id);
    const status = Registry.statusOf(id);
    for (const sel of ['#modelName', '#modelName2']) { const el = $(sel); if (el) el.textContent = label; }
    for (const sel of ['#modelDot', '#modelDot2']) { const el = $(sel); if (el) el.dataset.s = status; }
    const hint = $('#hintRouter');
    if (hint) {
      const r = Registry.routerById(id);
      hint.textContent = r ? (r.router === 'smart' ? 'Routed by request' : 'Cheapest healthy model') : `Using ${label}`;
    }
    const open = $('.pop [data-modellist]');
    if (open) this.paintModelList();
  },

  /* ---------------- popovers ---------------- */
  closePop() {
    if (!this.pop) return;
    const { el, anchor, onClose } = this.pop;
    el.remove(); this.pop = null;
    anchor?.setAttribute?.('aria-expanded', 'false');
    document.removeEventListener('pointerdown', this._outside, true);
    document.removeEventListener('keydown', this._popKeys, true);
    onClose?.();
  },

  openPop(anchor, html, opts = {}) {
    this.closePop();
    const el = document.createElement('div');
    el.className = 'pop' + (opts.sheet ? ' sheet' : '');
    el.innerHTML = html;
    if (opts.role) el.setAttribute('role', opts.role);
    document.body.append(el);

    const place = () => {
      const isSheet = opts.sheet && matchMedia('(max-width: 640px)').matches;
      if (isSheet) { el.style.cssText = ''; return; }
      const vw = innerWidth, vh = innerHeight;
      const w = Math.min(opts.width || 300, vw - 20);
      el.style.width = w + 'px';
      el.style.maxHeight = Math.min(opts.maxHeight || 460, vh - 24) + 'px';
      const r = anchor.getBoundingClientRect();
      const h = Math.min(el.offsetHeight, parseFloat(el.style.maxHeight));
      let top = r.bottom + 7, up = false;
      if (top + h > vh - 12) {
        if (r.top - 7 - h > 12) { top = r.top - 7 - h; up = true; }
        else top = Math.max(12, vh - h - 12);
      }
      let left = opts.align === 'left' ? r.left : r.right - w;
      left = clamp(left, 10, vw - w - 10);
      el.style.left = left + 'px'; el.style.top = top + 'px';
      el.classList.toggle('up', up);
    };
    place();
    requestAnimationFrame(place);

    this.pop = { el, anchor, onClose: opts.onClose, place };
    anchor?.setAttribute?.('aria-expanded', 'true');

    this._outside = (e) => { if (!el.contains(e.target) && !anchor?.contains?.(e.target)) this.closePop(); };
    this._popKeys = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); this.closePop(); anchor?.focus?.(); }
      else opts.onKey?.(e, el);
    };
    document.addEventListener('pointerdown', this._outside, true);
    document.addEventListener('keydown', this._popKeys, true);
    opts.onOpen?.(el);
    return el;
  },

  menu(anchor, items) {
    const html = `<div class="menu">${items.map((it) =>
      it === '-' ? '<hr>' : `<button data-act="${it.act}" class="${it.danger ? 'danger' : ''}">${svg(it.icon)}${esc(it.label)}</button>`).join('')}</div>`;
    const el = this.openPop(anchor, html, { width: 190, maxHeight: 400 });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      this.closePop();
      items.find((i) => i.act === b.dataset.act)?.run?.();
    });
    return el;
  },
};
/* ============================================================
   SATURDAY — panels: model picker · search · settings · routing

Object.assign(UI, {
  modelFilter: { q: '', chip: 'available' },

  openModelPicker(anchor) {
    if (this.pop?.el?.querySelector('[data-modellist]')) { this.closePop(); return; }

      <div class="filters" role="group" aria-label="Filter models">
        ${[['available', 'Available'], ['all', 'All'], ['favorites', 'Favorites'], ['vision', 'Vision'], ['reasoning', 'Reasoning']]

      </div>
      <div class="pop-list" data-modellist role="listbox" aria-label="Models"></div>`;

    const el = this.openPop(anchor, html, {

      },
      onKey: (e, p) => {
        const opts = $$('.opt:not([disabled])', p);
        if (!opts.length) return;
        let idx = opts.findIndex((o) => o.dataset.cursor === 'true');
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          idx = clamp(idx + (e.key === 'ArrowDown' ? 1 : -1), 0, opts.length - 1);
          opts.forEach((o) => (o.dataset.cursor = 'false'));
          opts[idx].dataset.cursor = 'true';
          opts[idx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); opts[idx].click(); }
      },
    });

    $('#modelQ', el).addEventListener('input', (e) => { this.modelFilter.q = e.target.value; this.paintModelList(); });
    el.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-chip]');
      if (chip) {
        this.modelFilter.chip = chip.dataset.chip;
        $$('[data-chip]', el).forEach((c) => c.setAttribute('aria-pressed', c === chip));
        this.paintModelList(); return;
      }
      const star = e.target.closest('[data-fav]');
      if (star) {
        e.stopPropagation();
        const id = star.dataset.fav;
        State.favorites = State.favorites.includes(id) ? State.favorites.filter((x) => x !== id) : [...State.favorites, id];
        LS.set('favorites', State.favorites); this.paintModelList(); return;
      }
      const opt = e.target.closest('[data-pick]');
      if (opt && !opt.disabled) {
        this.selectModel(opt.dataset.pick);
        this.closePop();
      }
    });
  },

  selectModel(id) {
    State.modelId = id;
    LS.set('model', id);
    State.recentModels = [id, ...State.recentModels.filter((x) => x !== id)].slice(0, 4);
    LS.set('recent', State.recentModels);
    if (State.active) { State.active.modelId = id; State.persist(State.active); }
    this.refreshModelIndicators();
  },

  paintModelList() {
    const list = $('[data-modellist]');
    if (!list) return;
    const q = this.modelFilter.q.trim().toLowerCase();
    const chip = this.modelFilter.chip;

    const match = (m, provName) => {
      if (!q) return true;
      return (m.displayName + ' ' + (m.blurb || '') + ' ' + (provName || '') + ' ' + m.id).toLowerCase().includes(q);
    };
    const passes = (m) => {
      if (chip === 'favorites') return State.favorites.includes(m.id);
      if (chip === 'vision') return m.capabilities?.vision;
      if (chip === 'reasoning') return m.capabilities?.reasoning;
      if (chip === 'available') return Registry.statusOf(m.id) === 'available' || Registry.statusOf(m.id) === 'degraded';
      return true;
    };

    let html = '';
    const routers = ROUTERS.filter((r) => match(r, 'router') && (chip === 'favorites' ? State.favorites.includes(r.id) : chip === 'vision' || chip === 'reasoning' ? true : true));
    if (routers.length) {
      html += `<div class="pop-group">Automatic</div>` + routers.map((r) => this.optHTML(r, true)).join('');
    }

    const recents = State.recentModels.map((id) => Registry.byId(id)).filter((m) => m && match(m) && passes(m));
    if (recents.length && !q) {
      html += `<div class="pop-group">Recent</div>` + recents.map((m) => this.optHTML(m)).join('');
    }

    for (const p of Object.values(Providers)) {
      const models = Registry.models.filter((m) => m.provider === p.id && match(m, p.name) && passes(m));
      const isEmptyApi = p.kind === 'api' && !models.length;
      if (!models.length && !(isEmptyApi && (chip === 'all' || q && p.name.toLowerCase().includes(q)))) continue;
      const usable = models.filter((m) => Registry.statusOf(m.id) === 'available').length;
      html += `<div class="pop-group">${esc(p.name)}<span class="n">${models.length ? `${usable}/${models.length} ready` : 'not configured'}</span></div>`;
      html += models.map((m) => this.optHTML(m)).join('');
      if (isEmptyApi) {
        html += `<div style="padding:4px 12px 12px;font-size:var(--t-xs);color:var(--ink-3);line-height:1.5">${esc(p.note)}</div>`;
      }
    }
    if (!html.includes('opt')) html = `<div class="empty-note">No models match that filter.</div>`;
    list.innerHTML = html;
  },

  optHTML(m, isRouter) {
    const status = Registry.statusOf(m.id);
    const h = isRouter ? null : Health.get(m.id);
    const sel = State.modelId === m.id;
    const fav = State.favorites.includes(m.id);
    const disabled = status === 'unavailable';
    const caps = !isRouter ? [m.capabilities.vision && 'vision', m.capabilities.reasoning && 'reasoning'].filter(Boolean) : [];
    return `<button class="opt" data-pick="${m.id}" role="option" aria-selected="${sel}" ${disabled ? 'disabled' : ''} data-cursor="false">
      <span class="ic">${svg(m.icon || 'spark')}</span>

  paintSearch(q) {
    const box = $('[data-results]'); if (!box) return;
    q = q.trim();
    if (!q) {
      const recent = State.conversations.filter((c) => !c.archived).slice(0, 8);
      box.innerHTML = (State.recentSearches.length
        ? `<div class="pop-group">Recent searches</div>` + State.recentSearches.slice(0, 4).map((s) =>
            `<button class="res" data-research="${esc(s)}"><span class="rt">${esc(s)}</span></button>`).join('')

    const ql = q.toLowerCase();
    const mark = (text, idx) => {
      const start = Math.max(0, idx - 42);

    };
    const titles = [], msgs = [];

      if (c.title.toLowerCase().includes(ql)) titles.push({ c });

        `<button class="res" data-goto="${c.id}" data-msg="${m.id}"><span class="rt">${esc(c.title)}</span><span class="rs">${mark(m.content, i)}</span></button>`).join('') : '') ||

/* ============================================================
   SATURDAY — brand & content application
   Mirrors the backend's SITE_DEFAULTS exactly, so the page looks
   identical whether or not a Saturday API is configured. When one
   is, GET /api/cms/site can override any piece of this.
   ============================================================ */
const Brand = {
  name: 'Saturday',
  tagline: 'A calm, intelligent AI companion.',
  favicon: '🪐',
  mark: '',                 // '' = built-in mark SVG; else raw <svg>…</svg> or an https:// image URL
  welcomeHeading: 'Saturday',
  welcomeSubheading: 'What are we working on today?',
  suggestions: ['Help me plan my week.', 'Explain something difficult.', 'Write something for me.', 'Help me build an idea.'],
  composerPlaceholder: 'Ask Saturday anything…',
  announcement: { enabled: false, text: '' },

  async load() {
    if (!Remote.isConfigured()) return;
    try {
      const res = await fetch(Remote.base() + '/api/cms/site', { headers: Remote.headers() });
      if (!res.ok) return;
      const cfg = await res.json();
      if (cfg.branding) Object.assign(this, {
        name: cfg.branding.name || this.name,
        tagline: cfg.branding.tagline ?? this.tagline,
        favicon: cfg.branding.favicon || this.favicon,
        mark: cfg.branding.mark ?? this.mark,
      });
      if (cfg.welcome) Object.assign(this, {
        welcomeHeading: cfg.welcome.heading || this.welcomeHeading,
        welcomeSubheading: cfg.welcome.subheading ?? this.welcomeSubheading,
        suggestions: Array.isArray(cfg.welcome.suggestions) && cfg.welcome.suggestions.length ? cfg.welcome.suggestions : this.suggestions,
      });
      if (cfg.composer?.placeholder) this.composerPlaceholder = cfg.composer.placeholder;
      if (cfg.announcement) this.announcement = { enabled: !!cfg.announcement.enabled, text: cfg.announcement.text || '' };
    } catch { /* keep defaults — this must never block the app from working */ }
  },

  faviconHref() {
    const f = this.favicon.trim();
    if (/^https?:\/\//.test(f) || /^data:/.test(f)) return f;
    // Treat anything else as a single emoji/character and render it onto a tiny SVG.
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="72" font-size="72" text-anchor="middle">${f}</text></svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  },

  markHTML() {
    const m = this.mark.trim();
    if (!m) return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="3.4"/></svg>`;
    if (/^https?:\/\//.test(m) || /^data:/.test(m)) return `<img src="${esc(m)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
    if (/^<svg[\s>]/i.test(m)) return m; // trusted: admin-only input, not user-generated
    return m;
  },

  apply() {
    document.title = this.name;
    const fav = $('#favicon'); if (fav) fav.href = this.faviconHref();
    $$('.brand-name').forEach((el) => (el.textContent = this.name));
    $$('.brand-mark').forEach((el) => (el.innerHTML = this.markHTML()));
    const input = $('#input'); if (input) input.placeholder = this.composerPlaceholder;
    if (State.active === null) UI.renderWelcome(); // re-paint with the loaded copy if we're still on the welcome screen
    UI.setTitle();
    this.paintAnnouncement();
  },

  paintAnnouncement() {
    const bar = $('#announce'); if (!bar) return;
    const dismissedText = LS.get('announceDismissed', '');
    const show = this.announcement.enabled && this.announcement.text && this.announcement.text !== dismissedText;
    bar.style.display = show ? 'flex' : 'none';
    if (show) $('#announceText').textContent = this.announcement.text;
  },
};
/* ============================================================
   SATURDAY — app controller
   ============================================================ */
const TEXTUAL = /\.(txt|md|markdown|csv|json|ya?ml|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|cs|php|sh|sql|html|css|scss|xml|toml|ini|log)$/i;
const LANG_OF = (n) => (n.match(/\.(\w+)$/)?.[1] || '').toLowerCase().replace(/^(md|markdown)$/, 'markdown');

const App = {
  /* ---------------- conversations ---------------- */
  openConversation(id, focusMsg) {
    if (State.streaming && State.streaming.convId !== id) Chat.stop();
    State.activeId = id;
    LS.set('active', id);
    UI.renderRail(); UI.renderThread();
    if (focusMsg) {
      requestAnimationFrame(() => {
        const el = $(`[data-msg="${focusMsg}"]`);
        el?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el?.animate?.([{ background: 'var(--ember-soft)' }, { background: 'transparent' }], { duration: 1400, easing: 'ease-out' });
      });
    }
    if (innerWidth <= 900) this.drawer(false);
    const m = State.conversations.find((c) => c.id === id)?.modelId;
    if (m && Registry.entry(m)) { State.modelId = m; UI.refreshModelIndicators(); }
  },

  newChat() {
    if (State.streaming) Chat.stop();
    State.activeId = null;
    UI.renderRail(); UI.renderThread();
    $('#input').focus();
    if (innerWidth <= 900) this.drawer(false);
  },

  convMenu(anchor, id) {
    const c = State.conversations.find((x) => x.id === id); if (!c) return;
    UI.menu(anchor, [
      { act: 'rename', icon: 'edit', label: 'Rename', run: () => this.renameInline(id) },
      { act: 'pin', icon: 'pin', label: c.pinned ? 'Unpin' : 'Pin', run: () => { c.pinned = !c.pinned; State.persist(c); Remote.syncPatch(c, { pinned: c.pinned ? 1 : 0 }); UI.renderRail(); } },
      { act: 'archive', icon: 'archive', label: c.archived ? 'Unarchive' : 'Archive', run: () => { c.archived = !c.archived; State.persist(c); Remote.syncPatch(c, { archived: c.archived ? 1 : 0 }); if (State.activeId === id && c.archived) this.newChat(); UI.renderRail(); } },
      { act: 'share', icon: 'share', label: 'Copy as text', run: () => this.exportConv(c) },
      '-',
      { act: 'delete', icon: 'trash', label: 'Delete', danger: true, run: () => {
          State.remove(id); UI.renderRail(); UI.renderThread(); toast('Conversation deleted', 'ok');
        } },
    ]);
  },

  renameInline(id) {
    const row = $(`[data-conv="${id}"]`); if (!row) return;
    const c = State.conversations.find((x) => x.id === id);
    const title = $('.conv-title', row);
    const input = document.createElement('input');
    input.value = c.title; title.replaceWith(input); input.focus(); input.select();
    const commit = (save) => {
      if (save && input.value.trim()) {
        c.title = input.value.trim().slice(0, 80);
        State.persist(c);
        Remote.syncPatch(c, { title: c.title });
      }
      UI.renderRail(); UI.setTitle();
    };
    input.onblur = () => commit(true);
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.onblur = null; commit(false); }
    };
  },

  exportConv(c) {
    const text = c.messages.map((m) => `${m.role === 'user' ? 'You' : 'Saturday'}:\n${m.content}`).join('\n\n———\n\n');
    navigator.clipboard?.writeText(`# ${c.title}\n\n${text}`).then(
      () => toast('Conversation copied', 'ok'),
      () => toast('Clipboard unavailable', 'error'));
  },

  paintAccount() {
    const name = LS.get('name', 'Your space');
    $('#accountName').textContent = name;
    $('#avatarInitial').textContent = (name.trim()[0] || 'S').toUpperCase();
  },

  /* ---------------- composer ---------------- */
  autosize() {
    const ta = $('#input');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, Math.min(innerHeight * 0.38, 260)) + 'px';
  },

  updateSend() {
    if (State.streaming) return UI.setSendMode('stop');
    UI.setSendMode('send');
  },

  async addFiles(files) {
    const limits = Providers['saturday-runtime'].limits;
    // Images work when either runtime supports them, or when a Saturday API is
    // configured (the backend receives them as data URLs — hence the 4 MB cap,
    // with a matching total limit enforced server-side).
    const imagesOk = !!limits?.images || Remote.isConfigured();
    for (const f of [...files].slice(0, 8)) {
      if (State.attachments.length >= 8) { toast('Up to 8 attachments per message', 'error'); break; }
      const isImage = /^image\//.test(f.type);
      if (isImage && !imagesOk) { toast('Images are not supported in this view', 'error'); continue; }
      if (isImage && f.size > 4 * 1024 * 1024) { toast(`${f.name} is too large — images are limited to 4 MB`, 'error'); continue; }
      if (isImage && limits?.images && f.size > limits.images.maxInputBytes) { toast(`${f.name} is too large`, 'error'); continue; }
      const a = { id: uid('a'), name: f.name || 'pasted-image.png', size: f.size, kind: isImage ? 'image' : TEXTUAL.test(f.name) ? 'code' : 'file', blob: f, status: 'ready' };
      if (isImage) a.url = URL.createObjectURL(f);
      else if (TEXTUAL.test(f.name) || /^text\//.test(f.type)) {
        a.status = 'reading';
        try { a.text = (await f.text()).slice(0, 120000); a.lang = LANG_OF(f.name); a.status = 'ready'; }
        catch { a.status = 'failed'; }
      } else {
        a.note = 'text not extracted in this build';
      }
      State.attachments.push(a);
    }
    this.paintAtts(); this.updateSend();
  },

  paintAtts() {
    const box = $('#atts');
    box.innerHTML = State.attachments.map((a) => `<span class="att" data-att="${a.id}">
      ${a.kind === 'image' && a.url ? `<img src="${a.url}" alt="">` : svg(a.kind === 'image' ? 'image' : 'file')}
      <b>${esc(a.name)}</b><i>${a.status === 'failed' ? 'unreadable' : a.note ? a.note : fmtBytes(a.size)}</i>
      <button type="button" data-rm="${a.id}" aria-label="Remove ${esc(a.name)}">${svg('x')}</button></span>`).join('');
  },

  clearAtts() {
    State.attachments.forEach((a) => a.url && URL.revokeObjectURL(a.url));
    State.attachments = []; this.paintAtts();
  },

  async submit() {
    if (State.streaming) { Chat.stop(); return; }
    const ta = $('#input');
    const text = ta.value.trim();
    if (!text && !State.attachments.length) return;
    const atts = State.attachments;
    State.attachments = []; this.paintAtts();
    ta.value = ''; this.autosize(); this.updateSend();
    this.voiceStop();
    try { await Chat.send(text, atts); }
    finally { atts.forEach((a) => a.url && setTimeout(() => URL.revokeObjectURL(a.url), 60000)); UI.renderRail(); }
  },

  /* ---------------- voice ---------------- */
  voice: { rec: null, stream: null, ctx: null, raf: null, base: '' },
  voiceSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },

  async voiceStart() {
    if (!this.voiceSupported()) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = State.settings.voiceLang;
    this.voice.base = $('#input').value ? $('#input').value.trim() + ' ' : '';
    rec.onresult = (e) => {
      let finalT = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalT += r[0].transcript; else interim += r[0].transcript;
      }
      if (finalT) this.voice.base += finalT.trim() + ' ';
      $('#input').value = (this.voice.base + interim).replace(/\s+/g, ' ');
      this.autosize(); this.updateSend();
      $('#voiceStatus').textContent = interim ? 'Hearing you…' : 'Listening…';
    };
    rec.onerror = (e) => {
      $('#voiceStatus').textContent = e.error === 'not-allowed' ? 'Microphone blocked' : 'Voice error';
      if (e.error === 'not-allowed') this.voiceStop();
    };
    rec.onend = () => { if (this.voice.rec) this.voiceStop(); };
    try { rec.start(); } catch { return; }
    this.voice.rec = rec;
    $('#composer').dataset.voice = 'true';
    $('#voiceBtn').setAttribute('aria-pressed', 'true');
    $('#voiceStatus').textContent = 'Listening…';
    this.meterStart();
  },

  voiceStop() {
    const v = this.voice;
    if (v.rec) { const r = v.rec; v.rec = null; try { r.stop(); } catch {} }
    $('#composer').dataset.voice = 'false';
    $('#voiceBtn')?.setAttribute('aria-pressed', 'false');
    cancelAnimationFrame(v.raf);
    v.stream?.getTracks().forEach((t) => t.stop()); v.stream = null;
    v.ctx?.close?.(); v.ctx = null;
    if (State.settings.autoplayVoice && $('#input').value.trim()) this.submit();
  },

  async meterStart() {
    const bars = $('#wave');
    if (!bars.children.length) bars.innerHTML = Array.from({ length: 28 }, () => '<i></i>').join('');
    if (!navigator.mediaDevices?.getUserMedia) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.voice.stream = stream;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.voice.ctx = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser(); an.fftSize = 128; src.connect(an);
      const data = new Uint8Array(an.frequencyBinCount);
      const tick = () => {
        an.getByteFrequencyData(data);
        const kids = bars.children;
        for (let i = 0; i < kids.length; i++) {
          const v = data[Math.floor(i * data.length / kids.length)] / 255;
          kids[i].style.height = clamp(v * 110, 12, 100) + '%';
        }
        this.voice.raf = requestAnimationFrame(tick);
      };
      tick();
    } catch { /* metering is optional; dictation still works */ }
  },

  /* ---------------- layout ---------------- */
  drawer(open) {
    $('#app').dataset.drawer = open ? 'open' : 'closed';
    if (open) setTimeout(() => $('#railClose')?.focus(), 60);
  },
  toggleRail() {
    const app = $('#app');
    if (innerWidth <= 900) return this.drawer(app.dataset.drawer !== 'open');
    const collapsed = app.dataset.rail === 'collapsed';
    app.dataset.rail = collapsed ? 'open' : 'collapsed';
    LS.set('rail', app.dataset.rail);
    $('#railOpen').style.display = collapsed ? 'none' : 'grid';
  },
  syncRail() {
    const app = $('#app');
    if (innerWidth <= 900) { $('#railOpen').style.display = 'grid'; app.dataset.rail = 'open'; }
    else {
      app.dataset.drawer = 'closed';
      app.dataset.rail = LS.get('rail', 'open');
      $('#railOpen').style.display = app.dataset.rail === 'collapsed' ? 'grid' : 'none';
    }
  },

  /* ---------------- events ---------------- */
  bind() {
    const ta = $('#input');
    ta.addEventListener('input', () => { this.autosize(); this.updateSend(); });
    ta.addEventListener('keydown', (e) => {
      const send = State.settings.enterToSend ? (e.key === 'Enter' && !e.shiftKey && !e.altKey) : (e.key === 'Enter' && (e.metaKey || e.ctrlKey));
      if (send) { e.preventDefault(); this.submit(); }
    });
    ta.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData?.files || [])];
      if (files.length) { e.preventDefault(); this.addFiles(files); }
    });

    $('#composer').addEventListener('submit', (e) => { e.preventDefault(); this.submit(); });
    $('#attach').addEventListener('click', () => $('#file').click());
    $('#file').addEventListener('change', (e) => { this.addFiles(e.target.files); e.target.value = ''; });
    $('#atts').addEventListener('click', (e) => {
      const b = e.target.closest('[data-rm]'); if (!b) return;
      const a = State.attachments.find((x) => x.id === b.dataset.rm);
      a?.url && URL.revokeObjectURL(a.url);
      State.attachments = State.attachments.filter((x) => x.id !== b.dataset.rm);
      this.paintAtts(); this.updateSend();
    });

    const comp = $('#composer');
    ['dragenter', 'dragover'].forEach((ev) => comp.addEventListener(ev, (e) => { e.preventDefault(); comp.dataset.drag = 'true'; }));
    ['dragleave', 'drop'].forEach((ev) => comp.addEventListener(ev, (e) => {
      e.preventDefault();
      if (ev === 'dragleave' && comp.contains(e.relatedTarget)) return;
      comp.dataset.drag = 'false';
      if (ev === 'drop' && e.dataTransfer?.files?.length) this.addFiles(e.dataTransfer.files);
    }));

    $('#voiceBtn').addEventListener('click', () => this.voice.rec ? this.voiceStop() : this.voiceStart());
    $('#voiceEnd').addEventListener('click', () => this.voiceStop());

    $('#modelPill').addEventListener('click', (e) => UI.openModelPicker(e.currentTarget));
    $('#composerModel').addEventListener('click', (e) => UI.openModelPicker(e.currentTarget));
    $('#newChat').addEventListener('click', () => this.newChat());
    $('#openSearch').addEventListener('click', () => UI.openSearch());
    $('#openSettings').addEventListener('click', () => UI.openSettings());
    $('#announceClose').addEventListener('click', () => {
      LS.set('announceDismissed', Brand.announcement.text);
      $('#announce').style.display = 'none';
    });
    $('#openAccount').addEventListener('click', () => UI.openSettings('account'));
    $('#railClose').addEventListener('click', () => this.toggleRail());
    $('#railOpen').addEventListener('click', () => this.toggleRail());
    $('#scrim').addEventListener('click', () => this.drawer(false));
    $('#convMore').addEventListener('click', (e) => {
      const c = State.active;
      if (!c) return toast('Start a conversation first');
      this.convMenu(e.currentTarget, c.id);
    });

    $('#railList').addEventListener('click', (e) => {
      const menu = e.target.closest('[data-conv-menu]');
      if (menu) { e.stopPropagation(); return this.convMenu(menu, menu.dataset.convMenu); }
      const row = e.target.closest('[data-conv]');
      if (row) this.openConversation(row.dataset.conv);
    });
    $('#railList').addEventListener('keydown', (e) => {
      const row = e.target.closest('[data-conv]');
      if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.openConversation(row.dataset.conv); }
    });

    $('#thread').addEventListener('click', async (e) => {
      const sugg = e.target.closest('[data-sugg]');
      if (sugg) { $('#input').value = sugg.dataset.sugg; this.autosize(); this.updateSend(); $('#input').focus(); return; }
      const copyCode = e.target.closest('[data-copy-code]');
      if (copyCode) {
        const code = $('#' + copyCode.dataset.copyCode);
        navigator.clipboard?.writeText(code?.dataset.raw || code?.textContent || '')
          .then(() => { copyCode.innerHTML = svg('check'); setTimeout(() => (copyCode.innerHTML = svg('copy')), 1400); },
                () => toast('Clipboard unavailable', 'error'));
        return;
      }
      const copy = e.target.closest('[data-copy]');
      if (copy) {
        const m = State.active?.messages.find((x) => x.id === copy.dataset.copy);
        navigator.clipboard?.writeText(m?.content || '').then(
          () => { copy.innerHTML = svg('check'); setTimeout(() => (copy.innerHTML = svg('copy')), 1400); },
          () => toast('Clipboard unavailable', 'error'));
        return;
      }
      const regen = e.target.closest('[data-regen]');
      if (regen) { if (State.streaming) Chat.stop(); await Chat.regenerate(regen.dataset.regen); return; }
      const edit = e.target.closest('[data-edit]');
      if (edit) {
        const conv = State.active; const idx = conv.messages.findIndex((m) => m.id === edit.dataset.edit);
        const m = conv.messages[idx];
        $('#input').value = m.content; this.autosize(); this.updateSend(); $('#input').focus();
        conv.messages = conv.messages.slice(0, idx);
        State.persist(conv); UI.renderThread();
        return;
      }
      const route = e.target.closest('[data-route]');
      if (route) return UI.openRouting(route, route.dataset.route);
      if (e.target.closest('[data-open-models]')) return UI.openModelPicker($('#modelPill'));
    });

    const scroll = $('#scroll');
    let btn = null;
    scroll.addEventListener('scroll', () => {
      $('#topbar').dataset.scrolled = scroll.scrollTop > 6;
      const near = UI.isAtBottom();
      if (!near && !btn && State.active?.messages.length) {
        btn = document.createElement('button');
        btn.className = 'scroll-btm'; btn.setAttribute('aria-label', 'Scroll to latest');
        btn.innerHTML = svg('down');
        btn.onclick = () => UI.scrollToEnd(true);
        $('.main').append(btn);
      } else if (near && btn) { btn.remove(); btn = null; }
    }, { passive: true });

    addEventListener('resize', debounce(() => { this.syncRail(); UI.pop?.place?.(); this.autosize(); }, 120));

    addEventListener('keydown', (e) => {
      const mod = isMac ? e.metaKey : e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); UI.closePop(); UI.openSearch(); }
      else if (mod && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); this.newChat(); }
      else if (mod && e.key === '/') { e.preventDefault(); UI.openModelPicker($('#modelPill')); }
      else if (mod && e.key === ',') { e.preventDefault(); UI.openSettings(); }
      else if (e.key === 'Escape' && State.streaming) Chat.stop();
    });

    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => UI.renderThread());
    addEventListener('beforeunload', (e) => { if (State.streaming) { e.preventDefault(); e.returnValue = ''; } });
  },

  /* ---------------- boot ---------------- */
  async start() {
    applyTheme();
    this.paintAccount();
    $('#kbdNew').textContent = isMac ? '⌘⇧O' : 'Ctrl⇧O';
    $('#kbdSearch').textContent = isMac ? '⌘K' : 'Ctrl K';
    if (!this.voiceSupported()) $('#voiceBtn').style.display = 'none';

    // blob: URLs do not survive a reload — drop them so no broken thumbnail renders
    for (const c of State.conversations)
      for (const m of c.messages)
        for (const a of (m.attachments || [])) if (typeof a.url === 'string' && a.url.startsWith('blob:')) delete a.url;

    State.modelId = LS.get('model', 'router-smart');
    State.activeId = LS.get('active', null);
    if (!State.conversations.find((c) => c.id === State.activeId)) State.activeId = null;

    this.syncRail();
    UI.renderRail(); UI.renderThread(); UI.refreshModelIndicators();
    Brand.apply(); // sidebar name/mark, favicon, announcement — defaults, before any network call
    this.bind(); this.autosize(); this.updateSend();

    // Capabilities resolve after first paint — the UI is already usable.
    const [, ] = await Promise.all([Registry.discover(), Brand.load()]);
    Brand.apply(); // re-paint with any overrides now that they've arrived
    if (!Registry.entry(State.modelId)) State.modelId = 'router-smart';
    UI.refreshModelIndicators();
    if (!Registry.available().length) {
      const hint = Remote.isConfigured()
        ? 'No model could be reached — check your Saturday API base URL in Settings.'
        : 'Model access is unavailable in this view — the interface is read-only.';
      toast(hint, 'error', 6000);
    }
    Store.connect();
  },
};

let _booted = false;
const boot = () => { if (_booted) return; _booted = true; App.start(); };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

// Exposed for anyone debugging from the browser console — not required by the app itself.
window.Saturday = { App, State, UI, Registry, Health, Chat, Router, Providers, Brand, Store };
</script>
</body>
</html>
