<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saturday — a calm, intelligent AI companion.">
<title>Saturday</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='72' text-anchor='middle'%3E%F0%9F%AA%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SATURDAY — design tokens
   White luxury · editorial · subtle liquid glass
   ============================================================ */
:root {
  color-scheme: light dark;

  /* — Palette (light) — */
  --paper:        #FAF8F5;
  --paper-warm:   #F3EFE9;
  --surface:      #FFFFFF;
  --surface-2:    #F7F5F1;
  --surface-3:    #EFEBE4;
  --ink:          #16140F;
  --ink-2:        #55504A;
  --ink-3:        #8B8681;
  --ink-4:        #B4AFA8;
  --line:         rgba(22, 20, 15, 0.075);
  --line-2:       rgba(22, 20, 15, 0.14);
  --accent:       #1D1B16;
  --accent-ink:   #FBFAF8;
  --ember:        #A8763C;
  --ember-soft:   rgba(168, 118, 60, 0.12);
  --good:         #4E8C6A;
  --warn:         #B98A2E;
  --bad:          #B0574C;

  /* — Glass — */
  --glass-bg:     rgba(255, 255, 255, 0.72);
  --glass-bg-2:   rgba(255, 255, 255, 0.86);
  --glass-line:   rgba(255, 255, 255, 0.75);
  --glass-blur:   saturate(170%) blur(22px);
  --glass-spec:   inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(22,20,15,0.035);

  /* — Elevation — */
  --sh-1: 0 1px 2px rgba(22,20,15,.05), 0 1px 1px rgba(22,20,15,.03);
  --sh-2: 0 2px 6px rgba(22,20,15,.05), 0 8px 20px -10px rgba(22,20,15,.10);
  --sh-3: 0 4px 14px rgba(22,20,15,.06), 0 18px 44px -16px rgba(22,20,15,.16);
  --sh-4: 0 10px 28px rgba(22,20,15,.09), 0 40px 80px -28px rgba(22,20,15,.24);

  /* — Space (4px grid) — */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --gutter: clamp(14px, 2.2vw, 28px);

  /* — Radius — */
  --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-full: 999px;

  /* — Type — */
  --font: "Outfit", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Space Grotesk", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --code: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs:  clamp(10.5px, .9vw, 11.5px);
  --t-sm:  clamp(12px, 1vw, 13px);
  --t-md:  clamp(13.5px, 1.1vw, 14.5px);
  --t-base:clamp(14.5px, 1.15vw, 16px);
  --t-lg:  clamp(17px, 1.6vw, 20px);
  --t-xl:  clamp(22px, 2.6vw, 30px);
  --t-2xl: clamp(30px, 4.4vw, 46px);

  /* — Motion — */
  --e-out:    cubic-bezier(.16,1,.3,1);
  --e-snap:   cubic-bezier(.32,.72,0,1);
  --e-inout:  cubic-bezier(.65,0,.35,1);
  --d-fast: 140ms; --d: 240ms; --d-slow: 420ms;

  /* — Shell metrics — */
  --rail: 268px;
  --thread: min(50rem, 100%);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #111010;
    --paper-warm: #171615;
    --surface:    #1A1918;
    --surface-2:  #201F1D;
    --surface-3:  #292725;
    --ink:        #F4F1EC;
    --ink-2:      #B3ADA5;
    --ink-3:      #857F78;
    --ink-4:      #5D5852;
    --line:       rgba(255, 250, 240, 0.085);
    --line-2:     rgba(255, 250, 240, 0.17);
    --accent:     #F4F1EC;
    --accent-ink: #16140F;
    --ember:      #D2A268;
    --ember-soft: rgba(210, 162, 104, 0.15);
    --good:       #6FB392;
    --warn:       #D6AC5B;
    --bad:        #D08678;
    --glass-bg:   rgba(32, 31, 29, 0.68);
    --glass-bg-2: rgba(32, 31, 29, 0.86);
    --glass-line: rgba(255, 250, 240, 0.10);
    --glass-spec: inset 0 1px 0 rgba(255,250,240,0.07), inset 0 -1px 0 rgba(0,0,0,0.25);
    --sh-1: 0 1px 2px rgba(0,0,0,.3);
    --sh-2: 0 2px 8px rgba(0,0,0,.34), 0 10px 24px -14px rgba(0,0,0,.6);
    --sh-3: 0 6px 18px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.7);
    --sh-4: 0 12px 34px rgba(0,0,0,.5), 0 46px 90px -30px rgba(0,0,0,.8);
  }
}

:root[data-theme="dark"] {
  --paper:      #111010;
  --paper-warm: #171615;
  --surface:    #1A1918;
  --surface-2:  #201F1D;
  --surface-3:  #292725;
  --ink:        #F4F1EC;
  --ink-2:      #B3ADA5;
  --ink-3:      #857F78;
  --ink-4:      #5D5852;
  --line:       rgba(255, 250, 240, 0.085);
  --line-2:     rgba(255, 250, 240, 0.17);
  --accent:     #F4F1EC;
  --accent-ink: #16140F;
  --ember:      #D2A268;
  --ember-soft: rgba(210, 162, 104, 0.15);
  --good:       #6FB392;
  --warn:       #D6AC5B;
  --bad:        #D08678;
  --glass-bg:   rgba(32, 31, 29, 0.68);
  --glass-bg-2: rgba(32, 31, 29, 0.86);
  --glass-line: rgba(255, 250, 240, 0.10);
  --glass-spec: inset 0 1px 0 rgba(255,250,240,0.07), inset 0 -1px 0 rgba(0,0,0,0.25);
  --sh-1: 0 1px 2px rgba(0,0,0,.3);
  --sh-2: 0 2px 8px rgba(0,0,0,.34), 0 10px 24px -14px rgba(0,0,0,.6);
  --sh-3: 0 6px 18px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.7);
  --sh-4: 0 12px 34px rgba(0,0,0,.5), 0 46px 90px -30px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'kern' 1, 'liga' 1;
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(70% 55% at 15% 0%, var(--paper-warm) 0%, transparent 60%),
    radial-gradient(60% 50% at 100% 100%, var(--ember-soft) 0%, transparent 65%);
  opacity: .9;
}
button, input, textarea, select { font: inherit; color: inherit; background: none; border: none; }
button { cursor: pointer; }
a { color: inherit; }
::selection { background: var(--ember-soft); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* scrollbars — quiet */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; border: 3px solid transparent; }
*::-webkit-scrollbar-track { background: transparent; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .01em; }

/* ---------- glass primitives ---------- */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line);
  box-shadow: var(--sh-2), var(--glass-spec);
}
@supports not (backdrop-filter: blur(1px)) {
  .glass { background: var(--surface); }
}

/* ---------- app shell ---------- */
.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  height: 100dvh;
  transition: grid-template-columns var(--d) var(--e-out);
}
.app[data-rail="collapsed"] { grid-template-columns: 0px minmax(0, 1fr); }

.main {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0; min-height: 0;
  position: relative;
}
.center { width: var(--thread); margin-inline: auto; padding-inline: var(--gutter); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  :root { --rail: min(310px, 86vw); }
}
/* ============================================================
   SIDEBAR
   ============================================================ */
.rail {
  position: relative; z-index: 30;
  display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
  min-height: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--paper-warm), transparent 40%);
  border-right: 1px solid var(--line);
  transition: transform var(--d) var(--e-out);
}
.app[data-rail="collapsed"] .rail { pointer-events: none; opacity: 0; }

.rail-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s3) var(--s2) var(--s4); }
.brand { display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 600; letter-spacing: -.02em; flex: 1; min-width: 0; }
.mark {
  width: 24px; height: 24px; border-radius: 8px; flex: none;
  background: linear-gradient(145deg, var(--ink) 20%, var(--ember) 160%);
  box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.28);
  display: grid; place-items: center;
}
.mark svg { width: 13px; height: 13px; color: var(--paper); }

.icon-btn {
  width: 32px; height: 32px; flex: none; border-radius: var(--r-sm);
  display: grid; place-items: center; color: var(--ink-2);
  transition: background var(--d-fast) var(--e-out), color var(--d-fast), transform var(--d-fast);
}
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.sm svg { width: 15px; height: 15px; }

.rail-actions { display: grid; gap: 6px; padding: var(--s1) var(--s3) var(--s3); }
.new-chat {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 12px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); font-size: var(--t-md); font-weight: 500;
  transition: transform var(--d-fast) var(--e-out), box-shadow var(--d-fast), border-color var(--d-fast);
}
.new-chat:hover { box-shadow: var(--sh-2); border-color: var(--line-2); transform: translateY(-1px); }
.new-chat:active { transform: translateY(0); }
.new-chat svg { width: 16px; height: 16px; color: var(--ink-2); }
.new-chat kbd { margin-left: auto; }

kbd {
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  background: var(--surface-2); line-height: 1.5;
}

.rail-search {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 12px; border-radius: var(--r-md); color: var(--ink-3);
  font-size: var(--t-md); transition: background var(--d-fast);
}
.rail-search:hover { background: var(--surface-3); color: var(--ink-2); }
.rail-search svg { width: 15px; height: 15px; }

.rail-list { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--s2) var(--s2); min-height: 0; }
.rail-group { padding: var(--s3) 10px 5px; }
.rail-group span {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .1em; color: var(--ink-4);
}
.conv {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 10px; border-radius: var(--r-sm); cursor: pointer;
  font-size: var(--t-md); color: var(--ink-2); min-width: 0;
  transition: background var(--d-fast) var(--e-out), color var(--d-fast);
}
.conv:hover { background: var(--surface-3); color: var(--ink); }
.conv[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); font-weight: 500; }
.conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .pin { width: 13px; height: 13px; flex: none; color: var(--ember); }
.conv .more { opacity: 0; flex: none; }
.conv:hover .more, .conv:focus-within .more { opacity: 1; }
@media (hover: none) { .conv .more { opacity: 1; } }
.conv input {
  flex: 1; min-width: 0; font-size: var(--t-md); border-bottom: 1px solid var(--ember);
  padding-bottom: 1px; color: var(--ink);
}
.conv input:focus-visible { outline: none; }

.rail-foot { padding: var(--s2) var(--s3) var(--s4); border-top: 1px solid var(--line); display: grid; gap: 2px; }
.rail-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: var(--r-sm); font-size: var(--t-md);
  color: var(--ink-2); transition: background var(--d-fast), color var(--d-fast);
}
.rail-item:hover { background: var(--surface-3); color: var(--ink); }
.rail-item svg { width: 16px; height: 16px; }
.avatar {
  width: 22px; height: 22px; border-radius: var(--r-full); flex: none;
  background: linear-gradient(145deg, var(--surface-3), var(--ember-soft));
  border: 1px solid var(--line-2); display: grid; place-items: center;
  font-size: 10px; font-weight: 600; color: var(--ink-2);
}

/* mobile drawer */
@media (max-width: 900px) {
  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail);
    background: var(--glass-bg-2);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: var(--sh-4); transform: translateX(-102%);
  }
  .app[data-drawer="open"] .rail { transform: none; }
  .app[data-rail="collapsed"] .rail { opacity: 1; pointer-events: auto; }
}
.scrim {
  position: fixed; inset: 0; z-index: 25; background: rgba(16,14,11,.32);
  opacity: 0; pointer-events: none; transition: opacity var(--d) var(--e-out);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.app[data-drawer="open"] .scrim { opacity: 1; pointer-events: auto; }
@media (min-width: 901px) { .scrim { display: none; } }

/* ============================================================
   HEADER
   ============================================================ */
.topbar {
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px var(--gutter); min-height: 54px;
  border-bottom: 1px solid transparent;
  transition: border-color var(--d), background var(--d);
}
.topbar[data-scrolled="true"] {
  border-color: var(--line);
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
}
.topbar-title {
  flex: 1; min-width: 0; font-size: var(--t-md); font-weight: 500; letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink);
}
.topbar-title small { color: var(--ink-3); font-weight: 400; }

.announce {
  display: none; align-items: center; gap: 10px; padding: 8px var(--gutter);
  background: var(--ember-soft); border-bottom: 1px solid var(--line);
  font-size: var(--t-sm); color: var(--ink);
}
.announce span { flex: 1; min-width: 0; }
.announce .icon-btn:hover { background: rgba(0,0,0,.06); }

.pill {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  height: 32px; padding: 0 10px 0 11px; border-radius: var(--r-full);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--sh-1); font-size: var(--t-sm); font-weight: 500; color: var(--ink);
  max-width: min(46vw, 250px);
  transition: border-color var(--d-fast), box-shadow var(--d-fast), transform var(--d-fast);
}
.pill:hover { border-color: var(--line-2); box-shadow: var(--sh-2); }
.pill:active { transform: scale(.98); }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill .chev { width: 13px; height: 13px; color: var(--ink-3); flex: none; }

.dot { width: 7px; height: 7px; border-radius: 99px; flex: none; background: var(--ink-4); }
.dot[data-s="available"] { background: var(--good); }
.dot[data-s="degraded"]  { background: var(--warn); }
.dot[data-s="unavailable"]{ background: transparent; border: 1.5px solid var(--ink-4); }
.dot[data-s="unknown"]   { background: var(--ink-4); opacity: .5; }
.dot[data-s="checking"]  { background: var(--ember); animation: pulse 1.4s var(--e-inout) infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

/* ============================================================
   THREAD / MESSAGES
   ============================================================ */
.thread-scroll { overflow-y: auto; overscroll-behavior-y: contain; scroll-behavior: smooth; min-height: 0; position: relative; }
@media (prefers-reduced-motion: reduce) { .thread-scroll { scroll-behavior: auto; } }
.thread { display: flex; flex-direction: column; gap: var(--s8); padding-block: var(--s6) var(--s10); }
.thread.compact { gap: var(--s5); }
.thread.compact .prose { line-height: 1.55; }
.thread.compact .msg-user .bubble { padding: 8px 13px; }

.msg { display: flex; flex-direction: column; animation: rise var(--d-slow) var(--e-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msg, .pop, .sheet, .modal { animation: none !important; } }

.msg-user { align-items: flex-end; }
.msg-user .bubble {
  max-width: min(88%, 42rem); padding: 10px 15px; border-radius: 18px 18px 6px 18px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1);
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--t-base);
}
.msg-assistant .prose { max-width: 100%; }

.msg-meta {
  display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
  font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-3);
}
.msg-meta .route {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px;
  border-radius: var(--r-full); border: 1px solid var(--line); cursor: pointer;
  transition: background var(--d-fast), border-color var(--d-fast);
}
.msg-meta .route:hover { background: var(--surface); border-color: var(--line-2); color: var(--ink-2); }
.route-ic { width: 11px; height: 11px; flex: none; }

.msg-actions { display: flex; gap: 2px; margin-top: 8px; opacity: 0; transition: opacity var(--d) var(--e-out); }
.msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; }
@media (hover: none) { .msg-actions { opacity: 1; } }
.msg-user .msg-actions { justify-content: flex-end; }

.att-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; justify-content: flex-end; }
.att {
  display: inline-flex; align-items: center; gap: 7px; max-width: 220px;
  padding: 5px 9px; border-radius: var(--r-sm); background: var(--surface-2);
  border: 1px solid var(--line); font-size: var(--t-sm); color: var(--ink-2);
}
.att svg { width: 14px; height: 14px; flex: none; color: var(--ink-3); }
.att b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.att i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--ink-4); flex: none; }
.att img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; margin: -2px 0 -2px -3px; }

/* generation state */
.state {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-3);
}
.state .bar { display: flex; gap: 3px; }
.state .bar i { width: 3px; height: 11px; border-radius: 2px; background: var(--ink-4); animation: breathe 1.2s var(--e-inout) infinite; }
.state .bar i:nth-child(2) { animation-delay: .14s; }
.state .bar i:nth-child(3) { animation-delay: .28s; }
@keyframes breathe { 0%,100% { transform: scaleY(.45); opacity: .4; } 50% { transform: scaleY(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .state .bar i { animation: none; opacity: .7; } }

.caret { display: inline-block; width: 2px; height: 1.05em; vertical-align: -2px; margin-left: 2px;
  background: var(--ember); border-radius: 1px; animation: blink 1.05s steps(2) infinite; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

/* ============================================================
   PROSE — editorial reading
   ============================================================ */
.prose { font-size: var(--t-base); line-height: 1.68; color: var(--ink); overflow-wrap: break-word; }
.prose > * + * { margin-top: .85em; }
.prose h1, .prose h2, .prose h3, .prose h4 { line-height: 1.25; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }
.prose h1 { font-size: 1.5em; margin-top: 1.5em; }
.prose h2 { font-size: 1.26em; margin-top: 1.5em; }
.prose h3 { font-size: 1.1em; margin-top: 1.3em; }
.prose h4 { font-size: 1em; color: var(--ink-2); margin-top: 1.2em; }
.prose > *:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: .32em; }
.prose li::marker { color: var(--ink-4); }
.prose ul li::marker { font-size: .9em; }
.prose blockquote {
  border-left: 2px solid var(--line-2); padding: 2px 0 2px 1em;
  color: var(--ink-2); font-style: italic;
}
.prose hr { border: none; border-top: 1px solid var(--line); margin: 1.8em 0; }
.prose a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; transition: text-decoration-color var(--d-fast); }
.prose a:hover { text-decoration-color: var(--ember); }
.prose strong { font-weight: 600; }
.prose img { max-width: 100%; border-radius: var(--r-md); border: 1px solid var(--line); }
.prose code:not(pre code) {
  font-family: var(--code); font-size: .875em; padding: .13em .38em;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
}
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: var(--t-md); }
.prose th, .prose td { padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font-weight: 600; font-size: var(--t-sm); color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.prose tr:last-child td { border-bottom: none; }

/* code blocks */
.codeblock {
  border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
  background: var(--surface); box-shadow: var(--sh-1);
}
.codeblock header {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 13px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.codeblock header .lang { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.codeblock pre { overflow-x: auto; padding: 13px 15px; margin: 0; }
.codeblock code { font-family: var(--code); font-size: 12.9px; line-height: 1.65; white-space: pre; }
.tok-kw { color: #8A5FBF; } .tok-str { color: #3D7A4E; } .tok-num { color: #A8763C; }
.tok-com { color: var(--ink-4); font-style: italic; } .tok-fn { color: #2F6FA8; } .tok-punc { color: var(--ink-3); }
:root[data-theme="dark"] .tok-kw { color: #C79BF0; } :root[data-theme="dark"] .tok-str { color: #8ECBA0; }
:root[data-theme="dark"] .tok-num { color: #E0B27C; } :root[data-theme="dark"] .tok-fn { color: #82B8E8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tok-kw { color: #C79BF0; }
  :root:not([data-theme="light"]) .tok-str { color: #8ECBA0; }
  :root:not([data-theme="light"]) .tok-num { color: #E0B27C; }
  :root:not([data-theme="light"]) .tok-fn { color: #82B8E8; }
}

/* math */
.math-block { display: block; overflow-x: auto; padding: .45em 0; text-align: center; }
.math { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 1.04em; }
.math i, .math .v { font-style: italic; }
.math .frac { display: inline-grid; vertical-align: -.52em; text-align: center; padding: 0 .18em; }
.math .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em .08em; }
.math .frac > span:last-child { padding: .08em .2em 0; }
.math sup, .math sub { font-size: .72em; }
.math .op { font-style: normal; padding: 0 .12em; }
.math .big { font-size: 1.35em; vertical-align: -.16em; }
.math .sqrt { border-top: 1px solid currentColor; padding: .1em .15em 0 .1em; margin-left: -.1em; }

/* ============================================================
   COMPOSER
   ============================================================ */
.dock { padding: 0 var(--gutter) max(var(--s4), env(safe-area-inset-bottom)); position: relative; }
.dock::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 44px;
  background: linear-gradient(to top, var(--paper) 12%, transparent);
  pointer-events: none;
}
.composer-wrap { width: var(--thread); margin-inline: auto; }

.composer {
  border-radius: var(--r-xl);
  background: var(--glass-bg-2);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-3), var(--glass-spec);
  transition: border-color var(--d) var(--e-out), box-shadow var(--d) var(--e-out), transform var(--d) var(--e-out);
}
.composer:focus-within { border-color: var(--ink-4); box-shadow: var(--sh-4), var(--glass-spec); }
/* the capsule itself shows focus (border + shadow above) — the plain-rect textarea inside it doesn't need its own outline on top */
.composer textarea:focus-visible { outline: none; }
.composer[data-drag="true"] { border-color: var(--ember); border-style: dashed; transform: scale(1.005); }

.composer-atts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
.composer-atts:empty { display: none; }
.composer-atts .att { background: var(--surface); }
.composer-atts .att button { display: grid; place-items: center; color: var(--ink-3); border-radius: 4px; }
.composer-atts .att button:hover { color: var(--bad); }
.composer-atts .att button svg { width: 12px; height: 12px; }

.composer textarea {
  display: block; width: 100%; resize: none; max-height: min(38dvh, 260px);
  padding: 13px 16px 4px; font-size: var(--t-base); line-height: 1.5;
  overflow-y: auto; field-sizing: content;
}
.composer textarea::placeholder { color: var(--ink-4); }

.composer-bar { display: flex; align-items: center; gap: 4px; padding: 5px 7px 7px 8px; }
.composer-bar .sp { flex: 1; min-width: 4px; }
.tool-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: var(--r-full); font-size: var(--t-sm); color: var(--ink-2);
  transition: background var(--d-fast), color var(--d-fast);
}
.tool-pill:hover { background: var(--surface-3); color: var(--ink); }
.tool-pill svg { width: 15px; height: 15px; }
.tool-pill[aria-pressed="true"] { background: var(--ember-soft); color: var(--ember); }
@media (max-width: 560px) { .tool-pill .lbl { display: none; } .tool-pill { padding: 0 8px; } }

.send {
  width: 34px; height: 34px; border-radius: var(--r-full); flex: none;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  transition: transform var(--d-fast) var(--e-out), opacity var(--d-fast), background var(--d-fast);
}
.send svg { width: 16px; height: 16px; }
.send:disabled { opacity: .3; cursor: default; }
.send:not(:disabled):hover { transform: scale(1.06); }
.send:not(:disabled):active { transform: scale(.94); }
.send[data-mode="stop"] { background: var(--bad); }

.hint { display: flex; justify-content: center; gap: 10px; padding-top: 7px; font-size: var(--t-xs); color: var(--ink-4); }
@media (max-width: 700px) { .hint { display: none; } }

/* voice */
.voice-panel { display: none; padding: 14px 16px 6px; align-items: center; gap: 14px; }
.composer[data-voice="true"] .voice-panel { display: flex; animation: rise var(--d) var(--e-out) both; }
.composer[data-voice="true"] textarea { min-height: 0; }
.wave { display: flex; align-items: center; gap: 3px; height: 26px; flex: 1; }
.wave i { flex: 1; max-width: 4px; border-radius: 2px; background: var(--ember); opacity: .75; height: 15%;
  transition: height 90ms linear; }
.voice-status { font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-2); white-space: nowrap; }

/* ============================================================
   WELCOME
   ============================================================ */
.welcome { display: grid; place-content: center; justify-items: center; gap: var(--s6); min-height: 100%; padding: var(--s8) 0 var(--s12); text-align: center; animation: rise var(--d-slow) var(--e-out) both; }
.welcome h1 { font-size: var(--t-2xl); font-weight: 300; letter-spacing: -.035em; line-height: 1.05; }
.welcome h1 b { font-weight: 600; }
.welcome p { color: var(--ink-3); font-size: var(--t-md); max-width: 34ch; margin-inline: auto; }
.sugg { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 36rem; }
.sugg button {
  padding: 7px 13px; border-radius: var(--r-full); font-size: var(--t-sm); color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1);
  transition: transform var(--d-fast) var(--e-out), box-shadow var(--d-fast), color var(--d-fast), border-color var(--d-fast);
}
.sugg button:hover { transform: translateY(-2px); box-shadow: var(--sh-2); color: var(--ink); border-color: var(--line-2); }

/* ============================================================
   POPOVER / SHEET / MODAL
   ============================================================ */
.pop {
  position: fixed; z-index: 60; border-radius: var(--r-lg);
  background: var(--glass-bg-2);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line-2); box-shadow: var(--sh-4), var(--glass-spec);
  overflow: hidden; animation: popin var(--d) var(--e-out) both;
  display: flex; flex-direction: column; min-height: 0;
}
@keyframes popin { from { opacity: 0; transform: translateY(-6px) scale(.985); } to { opacity: 1; transform: none; } }
.pop.up { animation-name: popup; }
@keyframes popup { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }

.menu { padding: 5px; min-width: 176px; }
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 7px 9px; border-radius: var(--r-xs); font-size: var(--t-md); color: var(--ink-2);
  transition: background var(--d-fast), color var(--d-fast);
}
.menu button:hover, .menu button[data-active="true"] { background: var(--surface-3); color: var(--ink); }
.menu button svg { width: 15px; height: 15px; flex: none; }
.menu button.danger:hover { color: var(--bad); }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }

.pop-search { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--line); flex: none; transition: background var(--d-fast); }
.pop-search:focus-within { background: var(--surface-2); }
.pop-search svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.pop-search input { flex: 1; min-width: 0; font-size: var(--t-md); }
.pop-search input:focus-visible { outline: none; }
.pop-search input::placeholder { color: var(--ink-4); }

.filters { display: flex; gap: 5px; padding: 9px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 4px 10px; border-radius: var(--r-full); font-size: var(--t-xs);
  font-family: var(--mono); color: var(--ink-3); border: 1px solid var(--line);
  transition: background var(--d-fast), color var(--d-fast), border-color var(--d-fast);
}
.chip:hover { color: var(--ink); border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.pop-list { overflow-y: auto; overscroll-behavior: contain; padding: 5px; min-height: 0; flex: 1; }
.pop-group {
  position: sticky; top: -5px; z-index: 1; padding: 9px 10px 5px;
  background: linear-gradient(var(--glass-bg-2) 72%, transparent);
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-4);
  display: flex; align-items: center; gap: 7px;
}
.pop-group .n { margin-left: auto; letter-spacing: 0; text-transform: none; }

.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: var(--r-sm); transition: background var(--d-fast);
}
.opt:hover, .opt[data-cursor="true"] { background: var(--surface-3); }
.opt[aria-selected="true"] { background: var(--surface); box-shadow: var(--sh-1); }
.opt .ic { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.opt .ic svg { width: 14px; height: 14px; }
.opt .txt { flex: 1; min-width: 0; }
.opt .t { font-size: var(--t-md); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.opt .d { font-size: var(--t-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .end { flex: none; display: flex; align-items: center; gap: 6px; color: var(--ink-4); }
.opt .end .lat { font-family: var(--mono); font-size: 10px; }
.opt .star { opacity: .0; transition: opacity var(--d-fast), color var(--d-fast); }
.opt:hover .star, .opt .star[data-on="true"] { opacity: 1; }
.opt .star[data-on="true"] { color: var(--ember); }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.badge {
  font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em;
  padding: 1.5px 5px; border-radius: 4px; background: var(--ember-soft); color: var(--ember); flex: none;
}
.empty-note { padding: 26px 16px; text-align: center; color: var(--ink-3); font-size: var(--t-sm); }

/* bottom sheet on mobile */
@media (max-width: 640px) {
  .pop.sheet {
    inset: auto 0 0 0 !important; width: 100% !important; max-width: none !important;
    max-height: 84dvh !important; border-radius: var(--r-xl) var(--r-xl) 0 0;
    border-bottom: none; animation: sheetin var(--d-slow) var(--e-out) both;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @keyframes sheetin { from { transform: translateY(100%); } to { transform: none; } }
  .pop.sheet::before {
    content: ""; display: block; width: 34px; height: 4px; border-radius: 99px;
    background: var(--line-2); margin: 8px auto 2px; flex: none;
  }
}

/* modal */
.modal-scrim {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: var(--s4);
  background: rgba(16,14,11,.34); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  animation: fade var(--d) var(--e-out) both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(680px, 100%); max-height: min(86dvh, 720px); display: flex; flex-direction: column;
  border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line-2);
  box-shadow: var(--sh-4); overflow: hidden; animation: popin var(--d-slow) var(--e-out) both;
}
.modal-head { display: flex; align-items: center; gap: var(--s3); padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none; }
.modal-head h2 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.02em; flex: 1; }
.modal-body { overflow-y: auto; padding: var(--s5) var(--s6) var(--s8); min-height: 0; }
@media (max-width: 640px) { .modal { max-height: 92dvh; } .modal-body { padding: var(--s4) var(--s4) var(--s8); } }

.settings-nav { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
.settings-nav::-webkit-scrollbar { display: none; }
.settings-nav button {
  flex: none; padding: 5px 11px; border-radius: var(--r-full); font-size: var(--t-sm); color: var(--ink-3);
  transition: background var(--d-fast), color var(--d-fast);
}
.settings-nav button:hover { color: var(--ink); background: var(--surface-2); }
.settings-nav button[aria-selected="true"] { background: var(--surface-3); color: var(--ink); font-weight: 500; }

.field { display: flex; align-items: center; gap: var(--s4); padding: 13px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: none; }
.field .lab { flex: 1; min-width: 0; }
.field .lab b { display: block; font-size: var(--t-md); font-weight: 500; }
.field .lab span { display: block; font-size: var(--t-sm); color: var(--ink-3); margin-top: 1px; }
.field .ctl { flex: none; }
.sec-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-4); margin: var(--s5) 0 var(--s1); }
.sec-title:first-child { margin-top: 0; }

.seg { display: inline-flex; padding: 2px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--line); }
.seg button { padding: 5px 12px; border-radius: var(--r-full); font-size: var(--t-sm); color: var(--ink-3); transition: all var(--d-fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); font-weight: 500; }

.field-input {
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px;
  font-size: var(--t-sm); background: var(--surface); transition: border-color var(--d-fast);
}
.field-input:focus-visible { outline: none; border-color: var(--ink-4); }
.field-input.underline {
  border: none; border-bottom: 1px solid var(--line-2); border-radius: 0; padding: 2px 0; background: none;
}
.field-input.underline:focus-visible { border-color: var(--ember); }

.switch {
  width: 42px; height: 25px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line);
  position: relative; transition: background var(--d) var(--e-out);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 99px;
  background: var(--surface); box-shadow: var(--sh-1); transition: transform var(--d) var(--e-snap);
}
.switch[aria-checked="true"] { background: var(--accent); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(17px); background: var(--accent-ink); }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--r-full);
  font-size: var(--t-sm); font-weight: 500; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--sh-1); transition: transform var(--d-fast) var(--e-out), box-shadow var(--d-fast), border-color var(--d-fast);
}
.btn:hover { box-shadow: var(--sh-2); border-color: var(--line-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

.health-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--t-md); }
.health-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.health-row .mono { color: var(--ink-3); flex: none; }

/* search results */
.res { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 9px 11px; border-radius: var(--r-sm); transition: background var(--d-fast); }
.res:hover, .res[data-cursor="true"] { background: var(--surface-3); }
.res .rt { font-size: var(--t-md); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .rs { font-size: var(--t-sm); color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.res mark { background: var(--ember-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

/* toasts */
.toasts { position: fixed; z-index: 90; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast {
  display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: var(--r-full);
  background: var(--glass-bg-2); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line-2); box-shadow: var(--sh-3); font-size: var(--t-sm);
  animation: toastin var(--d) var(--e-out) both; pointer-events: auto;
}
@keyframes toastin { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.toast[data-out="true"] { animation: toastout var(--d) var(--e-out) both; }
@keyframes toastout { to { opacity: 0; transform: translateY(6px) scale(.97); } }
.toast svg { width: 15px; height: 15px; flex: none; }
.toast[data-kind="error"] svg { color: var(--bad); }
.toast[data-kind="ok"] svg { color: var(--good); }

/* inline error card */
.err-card {
  display: flex; gap: 11px; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--line);
}
.err-card svg { width: 16px; height: 16px; color: var(--warn); flex: none; margin-top: 2px; }
.err-card .b { flex: 1; min-width: 0; }
.err-card b { font-size: var(--t-md); font-weight: 500; display: block; }
.err-card p { font-size: var(--t-sm); color: var(--ink-2); margin-top: 2px; }
.err-card .acts { display: flex; gap: 6px; margin-top: 9px; }

.scroll-btm {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);

<body>

<script>
/* ============================================================
   SATURDAY — deployment config
   Edit this before deploying to production. Every visitor who
   loads this file gets whatever you set here — nobody has to
   configure anything themselves.

   apiBase:
     ''              — no backend. Runs on the Claude.ai runtime only
                        (this is how the file works with zero setup as a
                        Claude artifact).
     'same-origin'   — the frontend and the Saturday API are served by the
                        same Worker (this repo's default deployment: Workers
                        Static Assets). No CORS setup needed.
     'https://…'     — the Saturday API's own URL, when it's hosted
                        on a different domain than this file.

   A visitor can still override this for themselves from
   Settings → AI & models — that always wins over what's set here.
   ============================================================ */
window.SATURDAY_CONFIG = {
  apiBase: 'same-origin',
};
/* ============================================================
   SATURDAY — core: utils, storage, state
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const blobToDataURL = (blob) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});
const fmtWhen = (t) => {
  const d = (Date.now() - t) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 604800) return Math.floor(d / 86400) + 'd ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const ICON = {
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<path d="m4 12.5 5 5L20 6.5"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  pin: '<path d="M12 17v5M9 3h6l-1 6 3.5 3.5V15H6.5v-2.5L10 9 9 3Z"/>',
  archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>',
  share: '<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M8 7l4-4 4 4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
  down: '<path d="M12 5v14M5 12l7 7 7-7"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>',
  brain: '<path d="M9.5 3A2.5 2.5 0 0 0 7 5.5v.2A2.8 2.8 0 0 0 4.5 8.5c0 .9.4 1.7 1 2.2a2.8 2.8 0 0 0 .3 4.6A2.5 2.5 0 0 0 8 19.8a2.5 2.5 0 0 0 4-.3V5.5A2.5 2.5 0 0 0 9.5 3Z"/><path d="M14.5 3A2.5 2.5 0 0 1 17 5.5v.2a2.8 2.8 0 0 1 2.5 2.8c0 .9-.4 1.7-1 2.2a2.8 2.8 0 0 1-.3 4.6 2.5 2.5 0 0 1-2.2 4.5"/>',
  route: '<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h4a4 4 0 0 0 4-4V7.5"/>',
  spark: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/>',
  cloud: '<path d="M17.5 19a4.5 4.5 0 0 0 .3-9A6 6 0 0 0 6.2 11 3.5 3.5 0 0 0 7 19Z"/>',
  star: '<path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
};
const svg = (name, cls = '') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ''}</svg>`;

/* ---------- toasts ---------- */
function toast(msg, kind = 'info', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast'; el.dataset.kind = kind;
  el.innerHTML = (kind === 'ok' ? svg('check') : kind === 'error' ? svg('alert') : svg('info')) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => { el.dataset.out = 'true'; setTimeout(() => el.remove(), 260); }, ms);
}

/* ---------- storage: localStorage primary, db capability mirrors ---------- */
const LS = {
  get(k, fb) { try { const v = localStorage.getItem('saturday:' + k); return v == null ? fb : JSON.parse(v); } catch { return fb; } },
  set(k, v) { try { localStorage.setItem('saturday:' + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem('saturday:' + k); } catch {} },
};

const Store = {
  db: null,                 // set if the db capability resolves
  ready: false,
  async connect() {
    try { this.db = (await window.claude?.use?.('db')) || null; } catch { this.db = null; }
    this.ready = true;
    if (!this.db) return;
    // hydrate anything durable that this browser does not have yet
    try {
      const snap = await this.db.collection('conversations').get?.();
      const rows = snap?.docs?.map((d) => d.data?.() ?? d) ?? [];
      let merged = 0;
      for (const r of rows) {
        if (!r || !r.id) continue;
        const local = State.conversations.find((c) => c.id === r.id);
        if (!local || (r.updatedAt || 0) > (local.updatedAt || 0)) {
          if (local) Object.assign(local, r); else State.conversations.push(r);
          merged++;
        }
      }
      if (merged) { State.persistLocal(); UI.renderRail(); }
    } catch { /* absent or unavailable — local copy stands */ }
  },
  saveConv(c) {
    if (!this.db) return;
    try { this.db.doc('conversations/' + c.id).set(JSON.parse(JSON.stringify(c))); } catch {}
  },
  dropConv(id) { if (!this.db) return; try { this.db.doc('conversations/' + id).delete(); } catch {} },
};

/* ---------- state ---------- */
const DEFAULT_SETTINGS = {
  theme: 'system',
  enterToSend: true,
  timestamps: false,
  compact: false,
  autoplayVoice: false,
  voiceLang: 'en-US',
  saveHistory: true,
  availableOnly: true,
  autoFallback: true,
  routerPreference: 'smart',
  showRouting: true,
};

const State = {
  conversations: LS.get('conversations', []),
  settings: { ...DEFAULT_SETTINGS, ...LS.get('settings', {}) },
  favorites: LS.get('favorites', []),
  recentModels: LS.get('recent', []),
  recentSearches: LS.get('searches', []),
  activeId: null,
  modelId: null,
  streaming: null,          // { abort, convId, msgId }
  attachments: [],

  get active() { return this.conversations.find((c) => c.id === this.activeId) || null; },

  persistLocal() { if (this.settings.saveHistory) LS.set('conversations', this.conversations); },
  persist(conv) {
    this.persistLocal();
    if (conv && this.settings.saveHistory) Store.saveConv(conv);
  },
  saveSettings() { LS.set('settings', this.settings); },

  newConversation(seedTitle) {
    const c = { id: uid('c'), title: seedTitle || 'New chat', messages: [], createdAt: Date.now(), updatedAt: Date.now(), pinned: false, archived: false, modelId: this.modelId };
    this.conversations.unshift(c);
    this.activeId = c.id;
    this.persist(c);
    return c;
  },
  touch(c) {
    c.updatedAt = Date.now();
    this.conversations = [c, ...this.conversations.filter((x) => x.id !== c.id)];
    this.persist(c);
  },
  remove(id) {
    const conv = this.conversations.find((c) => c.id === id);
    this.conversations = this.conversations.filter((c) => c.id !== id);
    Store.dropConv(id);
    if (typeof Remote !== 'undefined' && conv) Remote.syncDrop(conv);
    this.persistLocal();
    if (this.activeId === id) this.activeId = this.conversations.find((c) => !c.archived)?.id || null;
  },
};

/* ---------- theme ---------- */
function applyTheme() {
  const t = State.settings.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
/* ============================================================
   SATURDAY — content rendering: markdown · code · math
   Everything is escaped first; only tags we emit reach the DOM.
   ============================================================ */

/* ---------- syntax highlighting (lightweight, language-agnostic) ---------- */
const KEYWORDS = /\b(abstract|as|async|await|bool|break|case|catch|char|class|const|constexpr|continue|def|default|del|delete|do|double|elif|else|enum|except|export|extends|false|final|finally|float|fn|for|from|func|function|go|if|impl|implements|import|in|instanceof|int|interface|is|lambda|let|match|mod|move|mut|namespace|new|nil|none|not|null|or|package|pass|private|protected|public|pub|raise|readonly|ref|return|select|self|static|struct|super|switch|template|this|throw|throws|trait|true|try|type|typedef|typeof|undefined|union|unsafe|use|using|var|void|where|while|with|yield|and|elseif|end|then|local|echo|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|JOIN|GROUP|ORDER|BY|LIMIT)\b/g;

function highlight(code, lang) {
  const out = [];
  let i = 0;
  const src = code;
  const lineComment = /^(\/\/|#|--)/;
  while (i < src.length) {
    const rest = src.slice(i);
    let m;
    if ((m = rest.match(/^\/\*[\s\S]*?\*\/|^<!--[\s\S]*?-->|^"""[\s\S]*?"""/))) { out.push(['com', m[0]]); i += m[0].length; continue; }
    if (lineComment.test(rest) && !/^\/\/[^\n]*["']/.test('')) {
      const m2 = rest.match(/^(\/\/|#|--)[^\n]*/);
      if (m2) { out.push(['com', m2[0]]); i += m2[0].length; continue; }
    }
    if ((m = rest.match(/^(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/))) { out.push(['str', m[0]]); i += m[0].length; continue; }
    if ((m = rest.match(/^\b\d[\d_]*(\.\d+)?([eE][+-]?\d+)?\b/))) { out.push(['num', m[0]]); i += m[0].length; continue; }
    if ((m = rest.match(/^[A-Za-z_$][\w$]*/))) {
      const w = m[0];
      KEYWORDS.lastIndex = 0;
      const isKw = new RegExp('^(?:' + KEYWORDS.source.slice(2, -2) + ')$').test(w);
      const isFn = /^\s*\(/.test(rest.slice(w.length));
      out.push([isKw ? 'kw' : isFn ? 'fn' : '', w]);
      i += w.length; continue;
    }
    if ((m = rest.match(/^[{}()[\];,.:=+\-*/%<>!&|^~?]+/))) { out.push(['punc', m[0]]); i += m[0].length; continue; }
    out.push(['', rest[0]]); i += 1;
  }
  return out.map(([t, v]) => (t ? `<span class="tok-${t}">${esc(v)}</span>` : esc(v))).join('');
}

/* ---------- LaTeX → HTML (common constructs) ---------- */
const GREEK = { alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',varepsilon:'ε',zeta:'ζ',eta:'η',theta:'θ',vartheta:'ϑ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',upsilon:'υ',phi:'φ',varphi:'ϕ',chi:'χ',psi:'ψ',omega:'ω',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',Upsilon:'Υ',Phi:'Φ',Psi:'Ψ',Omega:'Ω' };
const SYMBOL = { times:'×',cdot:'·',div:'÷',pm:'±',mp:'∓',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',ne:'≠',approx:'≈',equiv:'≡',sim:'∼',propto:'∝',infty:'∞',partial:'∂',nabla:'∇',forall:'∀',exists:'∃',in:'∈',notin:'∉',subset:'⊂',subseteq:'⊆',cup:'∪',cap:'∩',emptyset:'∅',to:'→',rightarrow:'→',leftarrow:'←',Rightarrow:'⇒',Leftrightarrow:'⇔',mapsto:'↦',ldots:'…',cdots:'⋯',dots:'…',angle:'∠',perp:'⊥',parallel:'∥',degree:'°',prime:'′',ell:'ℓ',hbar:'ℏ',Re:'ℜ',Im:'ℑ',aleph:'ℵ',star:'⋆',circ:'∘',bullet:'∙',oplus:'⊕',otimes:'⊗',land:'∧',lor:'∨',neg:'¬',therefore:'∴',because:'∵' };
const BIGOP = { sum:'∑', prod:'∏', int:'∫', iint:'∬', oint:'∮', bigcup:'⋃', bigcap:'⋂', lim:'lim' };
const FUNCS = ['sin','cos','tan','sec','csc','cot','arcsin','arccos','arctan','sinh','cosh','tanh','log','ln','exp','det','dim','max','min','sup','inf','gcd','lcm','arg','deg','mod'];

function mathToHtml(src, display) {
  let i = 0;
  const readGroup = () => {
    while (src[i] === ' ') i++;
    if (src[i] === '{') {
      let depth = 1, start = ++i;
      while (i < src.length && depth > 0) { if (src[i] === '{') depth++; else if (src[i] === '}') depth--; i++; }
      return src.slice(start, i - 1);
    }
    if (src[i] === '\\') { const m = src.slice(i).match(/^\\[A-Za-z]+/); if (m) { i += m[0].length; return m[0]; } }
    return src[i++] ?? '';
  };
  let out = '';
  while (i < src.length) {
    const ch = src[i];
    if (ch === '\\') {
      const m = src.slice(i).match(/^\\([A-Za-z]+|[\\{}%$&_#,;! ])/);
      if (!m) { i++; continue; }
      const cmd = m[1]; i += m[0].length;
      if (cmd === 'frac' || cmd === 'dfrac' || cmd === 'tfrac') {
        const a = readGroup(), b = readGroup();
        out += `<span class="frac"><span>${mathToHtml(a)}</span><span>${mathToHtml(b)}</span></span>`;
      } else if (cmd === 'sqrt') {
        const a = readGroup();
        out += `<span class="op">√</span><span class="sqrt">${mathToHtml(a)}</span>`;
      } else if (cmd === 'text' || cmd === 'mathrm' || cmd === 'operatorname' || cmd === 'mathbf' || cmd === 'mathbb' || cmd === 'mathcal') {
        const a = readGroup();
        const w = cmd === 'mathbf' ? 'font-weight:600' : '';
        out += `<span class="op" style="${w}">${esc(a)}</span>`;
      } else if (cmd === 'left' || cmd === 'right') {
        const d = src[i] === '.' ? (i++, '') : src[i++] ?? '';
        out += `<span class="op">${esc(d === '\\' ? '' : d)}</span>`;
      } else if (BIGOP[cmd]) {
        out += `<span class="op ${cmd === 'lim' ? '' : 'big'}">${BIGOP[cmd]}</span>`;
      } else if (GREEK[cmd]) { out += `<i>${GREEK[cmd]}</i>`; }
      else if (SYMBOL[cmd]) { out += `<span class="op">${SYMBOL[cmd]}</span>`; }
      else if (FUNCS.includes(cmd)) { out += `<span class="op">${cmd}</span>`; }
      else if (cmd === '\\') { out += display ? '<br>' : ' '; }
      else if (cmd === ' ' || cmd === ',' || cmd === ';' || cmd === '!') { out += ' '; }
      else { out += `<span class="op">${esc(cmd)}</span>`; }
      continue;
    }
    if (ch === '^' || ch === '_') {
      i++; const g = readGroup();
      out += ch === '^' ? `<sup>${mathToHtml(g)}</sup>` : `<sub>${mathToHtml(g)}</sub>`;
      continue;
    }
    if (ch === '{' || ch === '}') { i++; continue; }
    if (/[A-Za-z]/.test(ch)) { out += `<i>${ch}</i>`; i++; continue; }
    if (/[+\-=<>*/|]/.test(ch)) { out += `<span class="op">${esc(ch === '*' ? '·' : ch)}</span>`; i++; continue; }
    out += esc(ch); i++;
  }
  return out;
}
const renderMath = (tex, display) =>
  `<span class="math${display ? ' math-block' : ''}">${mathToHtml(tex.trim(), display)}</span>`;

/* ---------- inline markdown ---------- */
function inline(s) {
  let t = esc(s);
  const stash = []; const keep = (html) => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };
  t = t.replace(/`([^`]+?)`/g, (_, c) => keep(`<code>${c}</code>`));
  t = t.replace(/\\\((.+?)\\\)/gs, (_, m) => keep(renderMath(m, false)));
  t = t.replace(/(?<!\$)\$([^$\n]+?)\$(?!\$)/g, (_, m) => keep(renderMath(m, false)));
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_, a, u) =>
    /^(https?:|data:image\/)/i.test(u) ? keep(`<img src="${u}" alt="${a}" loading="lazy">`) : esc(a));
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (_, a, u) =>
    /^(https?:|mailto:)/i.test(u) ? keep(`<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`) : a);
  t = t.replace(/(\*\*\*|___)(?=\S)(.+?)(?<=\S)\1/g, '<strong><em>$2</em></strong>');
  t = t.replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, '<strong>$2</strong>');
  t = t.replace(/(?<![\w*])\*(?=\S)([^*]+?)(?<=\S)\*(?![\w*])/g, '<em>$1</em>');
  t = t.replace(/(?<![\w_])_(?=\S)([^_]+?)(?<=\S)_(?![\w_])/g, '<em>$1</em>');
  t = t.replace(/~~(?=\S)(.+?)(?<=\S)~~/g, '<s>$1</s>');
  t = t.replace(/\u0000(\d+)\u0000/g, (_, n) => stash[+n]);
  return t;
}

/* ---------- block markdown ---------- */
function markdown(src) {
  if (!src) return '';
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  let html = '', i = 0;

  const listBlock = (ordered) => {
    let out = ordered ? '<ol>' : '<ul>';
    const re = ordered ? /^(\s*)(\d+)[.)]\s+(.*)$/ : /^(\s*)[-*+]\s+(.*)$/;
    let depth = 0;
    while (i < lines.length) {
      const m = lines[i].match(re);
      if (!m) {
        if (lines[i].trim() === '' && (lines[i + 1] || '').match(re)) { i++; continue; }
        break;
      }
      const ind = Math.floor(m[1].length / 2);
      const body = ordered ? m[3] : m[2];
      while (ind > depth) { out += ordered ? '<ol>' : '<ul>'; depth++; }
      while (ind < depth) { out += ordered ? '</ol>' : '</ul>'; depth--; }
      out += `<li>${inline(body)}</li>`;
      i++;
    }
    while (depth-- > 0) out += ordered ? '</ol>' : '</ul>';
    return out + (ordered ? '</ol>' : '</ul>');
  };

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const info = line.replace(/^\s*```/, '').trim();
      const [langRaw, fname] = info.split(':');
      const lang = (langRaw || '').trim();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++;
      const code = body.join('\n');
      const label = fname ? esc(fname.trim()) : (lang ? esc(lang) : 'text');
      const id = uid('code');
      html += `<div class="codeblock"><header><span class="lang">${label}</span>` +
        `<button class="icon-btn sm" data-copy-code="${id}" aria-label="Copy code">${svg('copy')}</button></header>` +
        `<pre><code id="${id}" data-raw="${esc(code)}">${highlight(code, lang)}</code></pre></div>`;
      continue;
    }

    if (/^\s*\$\$\s*$/.test(line)) {
      const body = []; i++;
      while (i < lines.length && !/^\s*\$\$\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;
      html += renderMath(body.join('\n'), true);
      continue;
    }
    const oneLineMath = line.match(/^\s*\$\$(.+?)\$\$\s*$/);
    if (oneLineMath) { html += renderMath(oneLineMath[1], true); i++; continue; }

    if (/^\s{0,3}(#{1,6})\s+/.test(line)) {
      const m = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
      const lv = clamp(m[1].length, 1, 4);
      html += `<h${lv}>${inline(m[2].replace(/\s+#+\s*$/, ''))}</h${lv}>`;
      i++; continue;
    }
    if (/^\s{0,3}([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { html += '<hr>'; i++; continue; }

    if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''));
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`;
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = cells(lines[i]); i += 2;
      let body = '';
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        body += '<tr>' + cells(lines[i++]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>';
      }
      html += `<div class="tbl-wrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
      continue;
    }

    if (/^\s*[-*+]\s+/.test(line)) { html += listBlock(false); continue; }
    if (/^\s*\d+[.)]\s+/.test(line)) { html += listBlock(true); continue; }

    if (line.trim() === '') { i++; continue; }

    const para = [];
    while (i < lines.length && lines[i].trim() !== '' &&
      !/^\s*(```|>|\|)/.test(lines[i]) && !/^\s{0,3}#{1,6}\s/.test(lines[i]) &&
      !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !/^\s*\$\$/.test(lines[i])) para.push(lines[i++]);
    if (para.length) html += `<p>${inline(para.join('\n')).replace(/\n/g, '<br>')}</p>`;
  }
  return html;
}

/* During streaming, close an unterminated fence so half-written code still renders as code. */
function markdownStreaming(src) {
  const fences = (src.match(/^\s*```/gm) || []).length;
  return markdown(fences % 2 ? src + '\n```' : src);
}

   SATURDAY — AI layer
   Provider abstraction → discovery → health → registry → router
   Nothing here reports a capability or a status it has not observed.
   ============================================================ */

const SATURDAY_SYSTEM = [
  'You are Saturday, a calm, precise, and genuinely helpful assistant.',
  'Write in clear prose. Use Markdown headings, lists, tables and fenced code blocks (with a language tag) where they help.',
  'Use LaTeX for mathematics: $inline$ and $$display$$.',
  'Be direct and concrete. Prefer a short, complete answer over a padded one. Say plainly when you are unsure.',
].join(' ');

/* ---------- self-hosted backend (optional) ----------
   When a Saturday API base is configured (Settings → AI & models), the three
   API-key providers below become live: they discover their models from the
   deployed Worker and stream replies through it. Inside the claude.ai preview
   this fetch is sandboxed and simply fails, so nothing here ever affects that
   experience unless a base URL is set. */
const Remote = {
  /** LS override (a visitor's own Settings entry) → the site owner's deploy config → disabled. */
  configuredBase() {
    const ls = LS.get('apiBase', '');
    if (ls) return ls;
    return (window.SATURDAY_CONFIG && window.SATURDAY_CONFIG.apiBase) || '';
  },
  isConfigured() { return this.configuredBase() !== ''; },
  /** The value actually used to build fetch URLs — 'same-origin' collapses to '' (a relative path). */
  base() {
    const b = this.configuredBase();
    return (b === 'same-origin' ? '' : b).replace(/\/+$/, '');
  },
  userId() { let id = LS.get('uid', ''); if (!id) { id = uid('u'); LS.set('uid', id); } return id; },
  headers(extra = {}) { return { 'content-type': 'application/json', 'x-saturday-user': this.userId(), ...extra }; },

  async ping() {
    if (!this.isConfigured()) return false;
    try { const r = await fetch(this.base() + '/api/health', { headers: this.headers() }); return r.ok; }
    catch { return false; }
  },

  _cache: null, _cacheAt: 0,
  /** One shared GET /api/models call feeds all three remote provider buckets. */
  async catalog(force) {
    if (!this.isConfigured()) return [];
    const base = this.base();
    if (!force && this._cache && Date.now() - this._cacheAt < 20000) return this._cache;
    try {
      const r = await fetch(base + `/api/models${force ? '?refresh=1' : ''}`, { headers: this.headers() });
      if (!r.ok) throw new Error('bad status');
      const body = await r.json();
      this._cache = body.models || []; this._cacheAt = Date.now();
      return this._cache;
    } catch { this._cache = this._cache || []; return this._cache; }
  },

  mapModel(m) {
    const tier = m.tier === 'small' ? 'quick' : m.tier === 'large' ? 'complex' : 'default';
    return {
      id: m.id, provider: m.provider, tier, displayName: m.displayName,
      blurb: m.status === 'available' || m.status === 'degraded' ? `${m.contextWindow ? Math.round(m.contextWindow / 1000) + 'K context' : 'Self-hosted'}`
        : (m.status === 'unknown' ? 'Not yet health-checked' : 'Unavailable on this deployment'),
      contextWindow: m.contextWindow, capabilities: m.capabilities, free: m.free,
      weight: tier === 'quick' ? 1 : tier === 'default' ? 2 : 3,
      remoteStatus: m.status, remoteLatency: m.latencyMs, remoteCheckedAt: m.lastCheckedAt,
    };
  },

  /** Converts Saturday's turn list into the {role,content}[] shape the backend expects,
      attaching images as content parts only on the final user turn. */
  toBackendMessages(turns, images) {
    const msgs = turns.map((t) => ({ role: t.role, content: t.content }));
    // the frontend's leading "user" turn carries the system prompt — send it as a real system turn
    if (msgs[0]?.role === 'user') msgs[0] = { role: 'system', content: msgs[0].content };
    if (images?.length) {
      const last = msgs[msgs.length - 1];
      const parts = [{ type: 'text', text: last.content }];
      for (const url of images) parts.push({ type: 'image_url', image_url: { url } });
      msgs[msgs.length - 1] = { role: 'user', content: parts };
    }
    return msgs;
  },

  errorFromCode(code, message) {
    const known = ['rate_limited', 'upstream_error', 'no_model', 'auth_failed', 'interrupted'];
    // auth_failed from the backend means the OPERATOR's provider key was rejected —
    // not that the visitor must sign in — so it must not render the runtime's
    // "sign in again" copy.
    const mapped = code === 'auth_failed' || code === 'interrupted' ? 'upstream_error' : code;
    return { code: known.includes(code) ? mapped : 'upstream_error', message };
  },

  /** Same {text,truncated} contract as the runtime's sample() function, so Chat.stream
      does not need to know which kind of provider it is talking to. */
  makeSample(providerId) {
    return async (turns, opts = {}) => {
      const base = this.base();
      if (!base) { const e = new Error('not configured'); e.code = 'not_declared'; throw e; }
      const modelId = opts.modelId;
      const messages = this.toBackendMessages(turns, opts.imageUrls || []);
      let res;
      try {
        res = await fetch(base + '/api/chat/stream', {
          method: 'POST', headers: this.headers(), signal: opts.signal,
          body: JSON.stringify({ messages, model: modelId }),
        });
      } catch (e) {
        if (opts.signal?.aborted) { const err = new Error('cancelled'); err.code = 'cancelled'; throw err; }
        const err = new Error('network'); err.code = 'upstream_error'; throw err;
      }
      if (!res.ok || !res.body) {
        const body = await res.json().catch(() => ({}));
        const err = new Error(body.message || 'request failed');
        Object.assign(err, this.errorFromCode(body.error, body.message));
        throw err;
      }
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '', whole = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const frames = buffer.split('\n\n'); buffer = frames.pop() || '';
        for (const frame of frames) {
          const ev = frame.match(/^event: (.+)$/m)?.[1];
          const dataLine = frame.match(/^data: (.+)$/m)?.[1];
          if (!ev || !dataLine) continue;
          let data; try { data = JSON.parse(dataLine); } catch { continue; }
          if (ev === 'delta') { whole += data.delta; opts.onText?.({ text: whole, delta: data.delta }); }
          else if (ev === 'routing') { opts.onRouting?.(data); }
          else if (ev === 'done') { opts.onDone?.(data); }
          else if (ev === 'error') {
            const err = new Error(data.message || 'upstream error');
            if (whole) err.text = whole;
            Object.assign(err, this.errorFromCode(data.code, data.message));
            throw err;
          }
        }
      }
      return { text: whole, truncated: false };
    };
  },

  /* ---- server-side history mirror ----
     When a backend is configured, conversations are mirrored there under this
     device's id, so the admin panel's Users/Conversations views reflect reality.
     Strictly fire-and-forget: a sync failure never blocks or alters the local,
     always-available copy of the history. */
  syncEnabled() { return this.isConfigured() && State.settings.saveHistory; },

  async syncEnsure(conv) {
    if (conv.remoteId || !this.syncEnabled()) return conv.remoteId || null;
    try {
      const r = await fetch(this.base() + '/api/conversations', {
        method: 'POST', headers: this.headers(),
        body: JSON.stringify({ title: conv.title, modelId: conv.modelId || null }),
      });
      if (!r.ok) return null;
      const { id } = await r.json();
      conv.remoteId = id || null;
      if (conv.remoteId) State.persistLocal();
      return conv.remoteId;
    } catch { return null; }
  },

  /** Upserts by client-side message id on the server, so retries and
      regenerate runs converge instead of duplicating rows. */
  async syncMessages(conv, msgs) {
    if (!conv.remoteId || !this.syncEnabled()) return;
    const payload = msgs.filter(Boolean)
      .map((m) => ({ id: m.id, role: m.role, content: m.content || '', routing: m.routing || undefined, createdAt: m.createdAt }))
      .filter((m) => m.content);
    if (!payload.length) return;
    try {
      await fetch(this.base() + `/api/conversations/${conv.remoteId}/messages`, {
        method: 'POST', headers: this.headers(), body: JSON.stringify({ messages: payload }),
      });
    } catch { /* the local copy stands; the next message re-pushes these */ }
  },

  async syncPatch(conv, patch) {
    if (!conv.remoteId || !this.syncEnabled()) return;
    try {
      await fetch(this.base() + `/api/conversations/${conv.remoteId}`, {
        method: 'PATCH', headers: this.headers(), body: JSON.stringify(patch),
      });
    } catch { /* cosmetic drift at worst */ }
  },

  syncDrop(conv) {
    if (!conv?.remoteId || !this.syncEnabled()) return;
    fetch(this.base() + `/api/conversations/${conv.remoteId}`, { method: 'DELETE', headers: this.headers() }).catch(() => {});
  },
};
