<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Saturday Admin — manage providers, models, routing, users and content.">
<title>Saturday Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SATURDAY — design tokens
   White luxury · editorial · subtle liquid glass
   ============================================================ */
:root {
  color-scheme: light dark;

  /* — Palette (light) — */
  --paper:        #FAF8F5;
  --paper-warm:   #F3EFE9;
  --surface:      #FFFFFF;
  --surface-2:    #F7F5F1;
  --surface-3:    #EFEBE4;
  --ink:          #16140F;
  --ink-2:        #55504A;
  --ink-3:        #8B8681;
  --ink-4:        #B4AFA8;
  --line:         rgba(22, 20, 15, 0.075);
  --line-2:       rgba(22, 20, 15, 0.14);
  --accent:       #1D1B16;
  --accent-ink:   #FBFAF8;
  --ember:        #A8763C;
  --ember-soft:   rgba(168, 118, 60, 0.12);
  --good:         #4E8C6A;
  --warn:         #B98A2E;
  --bad:          #B0574C;

  /* — Glass — */
  --glass-bg:     rgba(255, 255, 255, 0.72);
  --glass-bg-2:   rgba(255, 255, 255, 0.86);
  --glass-line:   rgba(255, 255, 255, 0.75);
  --glass-blur:   saturate(170%) blur(22px);
  --glass-spec:   inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(22,20,15,0.035);

  /* — Elevation — */
  --sh-1: 0 1px 2px rgba(22,20,15,.05), 0 1px 1px rgba(22,20,15,.03);
  --sh-2: 0 2px 6px rgba(22,20,15,.05), 0 8px 20px -10px rgba(22,20,15,.10);
  --sh-3: 0 4px 14px rgba(22,20,15,.06), 0 18px 44px -16px rgba(22,20,15,.16);
  --sh-4: 0 10px 28px rgba(22,20,15,.09), 0 40px 80px -28px rgba(22,20,15,.24);

  /* — Space (4px grid) — */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --gutter: clamp(14px, 2.2vw, 28px);

  /* — Radius — */
  --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-full: 999px;

  /* — Type — */
  --font: "Outfit", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Space Grotesk", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --code: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs:  clamp(10.5px, .9vw, 11.5px);
  --t-sm:  clamp(12px, 1vw, 13px);
  --t-md:  clamp(13.5px, 1.1vw, 14.5px);
  --t-base:clamp(14.5px, 1.15vw, 16px);
  --t-lg:  clamp(17px, 1.6vw, 20px);
  --t-xl:  clamp(22px, 2.6vw, 30px);
  --t-2xl: clamp(30px, 4.4vw, 46px);

  /* — Motion — */
  --e-out:    cubic-bezier(.16,1,.3,1);
  --e-snap:   cubic-bezier(.32,.72,0,1);
  --e-inout:  cubic-bezier(.65,0,.35,1);
  --d-fast: 140ms; --d: 240ms; --d-slow: 420ms;

  /* — Shell metrics — */
  --rail: 268px;
  --thread: min(50rem, 100%);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #111010;
    --paper-warm: #171615;
    --surface:    #1A1918;
    --surface-2:  #201F1D;
    --surface-3:  #292725;
    --ink:        #F4F1EC;
    --ink-2:      #B3ADA5;
    --ink-3:      #857F78;
    --ink-4:      #5D5852;
    --line:       rgba(255, 250, 240, 0.085);
    --line-2:     rgba(255, 250, 240, 0.17);
    --accent:     #F4F1EC;
    --accent-ink: #16140F;
    --ember:      #D2A268;
    --ember-soft: rgba(210, 162, 104, 0.15);
    --good:       #6FB392;
    --warn:       #D6AC5B;
    --bad:        #D08678;
    --glass-bg:   rgba(32, 31, 29, 0.68);
    --glass-bg-2: rgba(32, 31, 29, 0.86);
    --glass-line: rgba(255, 250, 240, 0.10);
    --glass-spec: inset 0 1px 0 rgba(255,250,240,0.07), inset 0 -1px 0 rgba(0,0,0,0.25);
    --sh-1: 0 1px 2px rgba(0,0,0,.3);
    --sh-2: 0 2px 8px rgba(0,0,0,.34), 0 10px 24px -14px rgba(0,0,0,.6);
    --sh-3: 0 6px 18px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.7);
    --sh-4: 0 12px 34px rgba(0,0,0,.5), 0 46px 90px -30px rgba(0,0,0,.8);
  }
}

:root[data-theme="dark"] {
  --paper:      #111010;
  --paper-warm: #171615;
  --surface:    #1A1918;
  --surface-2:  #201F1D;
  --surface-3:  #292725;
  --ink:        #F4F1EC;
  --ink-2:      #B3ADA5;
  --ink-3:      #857F78;
  --ink-4:      #5D5852;
  --line:       rgba(255, 250, 240, 0.085);
  --line-2:     rgba(255, 250, 240, 0.17);
  --accent:     #F4F1EC;
  --accent-ink: #16140F;
  --ember:      #D2A268;
  --ember-soft: rgba(210, 162, 104, 0.15);
  --good:       #6FB392;
  --warn:       #D6AC5B;
  --bad:        #D08678;
  --glass-bg:   rgba(32, 31, 29, 0.68);
  --glass-bg-2: rgba(32, 31, 29, 0.86);
  --glass-line: rgba(255, 250, 240, 0.10);
  --glass-spec: inset 0 1px 0 rgba(255,250,240,0.07), inset 0 -1px 0 rgba(0,0,0,0.25);
  --sh-1: 0 1px 2px rgba(0,0,0,.3);
  --sh-2: 0 2px 8px rgba(0,0,0,.34), 0 10px 24px -14px rgba(0,0,0,.6);
  --sh-3: 0 6px 18px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.7);
  --sh-4: 0 12px 34px rgba(0,0,0,.5), 0 46px 90px -30px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: var(--t-base);
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'kern' 1, 'liga' 1;
  overflow: hidden;
}
/* ============================================================
   SATURDAY ADMIN — layout & components
   Same tokens as the product, a working dashboard on top.
   ============================================================ */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  /* anchored off-canvas with soft stops — no visible seam cutting through content */
  background: radial-gradient(90% 70% at 10% -10%, var(--paper-warm) 0%, transparent 55%),
              radial-gradient(80% 60% at 110% 110%, var(--ember-soft) 0%, transparent 62%);
}
button, input, textarea, select { font: inherit; color: inherit; background: none; border: none; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--ember-soft); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
.mono { font-family: var(--mono); font-size: var(--t-xs); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.glass {
  background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--line); box-shadow: var(--sh-2), var(--glass-spec);
}
@supports not (backdrop-filter: blur(1px)) { .glass { background: var(--surface); } }

/* ---------------- login ---------------- */
.login { min-height: 100dvh; display: grid; place-items: center; padding: var(--s6); position: relative; z-index: 1; }
.login-card { width: min(380px, 100%); padding: var(--s8) var(--s6); border-radius: var(--r-xl); display: grid; gap: var(--s5); }
.login-brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.login-mark {
  width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none;
  background: linear-gradient(145deg, var(--ink) 20%, var(--ember) 160%); box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.28);
}
.login-mark svg { width: 15px; height: 15px; color: var(--paper); }
.login-sub { color: var(--ink-3); font-size: var(--t-sm); margin-top: -8px; }
.login label { display: block; font-size: var(--t-sm); font-weight: 500; margin-bottom: 6px; }
.login input {
  width: 100%; padding: 10px 13px; border-radius: var(--r-md); background: var(--surface);
  border: 1px solid var(--line); font-size: var(--t-base); transition: border-color var(--d-fast);
}
.login input:focus { border-color: var(--ink-4); }
.login-field + .login-field { margin-top: var(--s3); }
.login-err {
  display: none; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); font-size: var(--t-sm);
}
.login-err.show { display: flex; }
.login-err svg { width: 15px; height: 15px; flex: none; }

/* ---------------- shell ---------------- */
.shell { display: none; height: 100dvh; grid-template-columns: 240px minmax(0, 1fr); position: relative; z-index: 1; }
.shell.show { display: grid; }
.nav {
  border-right: 1px solid var(--line); background: linear-gradient(180deg, var(--paper-warm), transparent 40%);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0;
}
.nav-head { display: flex; align-items: center; gap: 9px; padding: var(--s4); font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
.nav-head .mark {
  width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--ink) 20%, var(--ember) 160%); box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.28);
}
.nav-head .mark svg { width: 13px; height: 13px; color: var(--paper); }
.nav-head small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 1px; }

.nav-list { overflow-y: auto; padding: var(--s2); display: grid; gap: 1px; align-content: start; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm);
  font-size: var(--t-md); color: var(--ink-2); transition: background var(--d-fast), color var(--d-fast);
}
.nav-item svg { width: 16px; height: 16px; flex: none; }
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); font-weight: 500; }
.nav-item .n { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
.nav-divider { height: 1px; background: var(--line); margin: var(--s2) 6px; }
.nav-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-4); padding: 10px 10px 4px; }

.nav-foot { padding: var(--s3); border-top: 1px solid var(--line); display: grid; gap: 6px; }
.env-pill { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); font-size: var(--t-xs); }
.env-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; color: var(--ink-2); }
.logout-btn { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--r-sm); font-size: var(--t-sm); color: var(--ink-2); }
.logout-btn:hover { background: var(--surface-3); color: var(--bad); }
.logout-btn svg { width: 15px; height: 15px; }

.content { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: var(--s3); padding: 14px var(--s6); border-bottom: 1px solid var(--line);
  min-height: 58px;
}
.topbar h1 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.02em; flex: 1; }
.topbar .sub { font-size: var(--t-sm); color: var(--ink-3); }
.maint-banner {
  display: none; align-items: center; gap: 8px; padding: 7px 14px; font-size: var(--t-sm);
  background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border-bottom: 1px solid var(--line);
}
.maint-banner.show { display: flex; }
.maint-banner svg { width: 15px; height: 15px; }

.view { overflow-y: auto; padding: var(--s6); min-height: 0; }
.view-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: var(--s6); }
@media (max-width: 900px) {
  .shell.show { grid-template-columns: 1fr; }
  .nav { position: fixed; inset: 0 auto 0 0; width: 240px; z-index: 40; transform: translateX(-100%);
    transition: transform var(--d) var(--e-out); background: var(--glass-bg-2);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--sh-4); }
  .shell[data-nav="open"] .nav { transform: none; }
  .nav-scrim { position: fixed; inset: 0; z-index: 35; background: rgba(16,14,11,.32); opacity: 0; pointer-events: none; transition: opacity var(--d); }
  .shell[data-nav="open"] .nav-scrim { opacity: 1; pointer-events: auto; }
}
@media (min-width: 901px) { .nav-scrim { display: none; } }

/* ---------------- cards / stat grid ---------------- */
.section-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.section-head h2 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.02em; }
.section-head .desc { color: var(--ink-3); font-size: var(--t-sm); }
.section-head .sp { flex: 1; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s3); }
.stat-card { padding: var(--s5); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); }
.stat-card .lbl { font-size: var(--t-xs); color: var(--ink-3); font-family: var(--mono); text-transform: uppercase; letter-spacing: .07em; }
.stat-card .val { font-size: 28px; font-weight: 300; letter-spacing: -.02em; margin-top: 6px; display: flex; align-items: baseline; gap: 7px; }
.stat-card .val b { font-weight: 600; }
.stat-card .val small { font-size: var(--t-sm); color: var(--ink-3); font-weight: 400; }
.stat-card .foot { margin-top: 8px; font-size: var(--t-xs); color: var(--ink-3); display: flex; align-items: center; gap: 6px; }

.card { border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--sh-1); overflow: hidden; }
.card-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
.card-head h3 { font-size: var(--t-base); font-weight: 600; }
.card-head .sp { flex: 1; }
.card-body { padding: var(--s5); }
.card-body.pad0 { padding: 0; }

/* ---------------- table ---------------- */
.table-wrap { overflow-x: auto; }
table.dt { width: 100%; border-collapse: collapse; font-size: var(--t-md); }
table.dt th, table.dt td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
table.dt th { font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
table.dt td.wrap { white-space: normal; }
table.dt tbody tr { transition: background var(--d-fast); }
table.dt tbody tr:hover { background: var(--surface-2); }
table.dt tbody tr:last-child td { border-bottom: none; }
table.dt td.num { font-family: var(--mono); font-size: var(--t-sm); color: var(--ink-2); }
table.dt .rowlink { cursor: pointer; }

.dot { width: 7px; height: 7px; border-radius: 99px; flex: none; display: inline-block; background: var(--ink-4); }
.dot[data-s="available"], .dot[data-s="active"], .dot[data-s="true"], .dot[data-s="ok"] { background: var(--good); }
.dot[data-s="degraded"] { background: var(--warn); }
.dot[data-s="unavailable"], .dot[data-s="suspended"], .dot[data-s="false"] { background: transparent; border: 1.5px solid var(--ink-4); }
.dot[data-s="unknown"] { background: var(--ink-4); opacity: .5; }

.badge { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); display: inline-block; }
.badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.badge.accent { background: var(--ember-soft); color: var(--ember); }

/* ---------------- forms ---------------- */
.field { display: flex; align-items: center; gap: var(--s4); padding: 12px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: none; }
.field .lab { flex: 1; min-width: 0; }
.field .lab b { display: block; font-size: var(--t-md); font-weight: 500; }
.field .lab span { display: block; font-size: var(--t-sm); color: var(--ink-3); margin-top: 1px; }
.field .ctl { flex: none; }
.sec-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-4); margin: var(--s5) 0 var(--s1); }
.sec-title:first-child { margin-top: 0; }

.tf {
  width: 100%; padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line);
  font-size: var(--t-sm); transition: border-color var(--d-fast);
}
.tf:focus { border-color: var(--ink-4); }
textarea.tf { resize: vertical; min-height: 90px; font-family: var(--code); font-size: 12.5px; line-height: 1.55; }
.numf { width: 76px; text-align: right; }

.seg { display: inline-flex; padding: 2px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--line); }
.seg button { padding: 5px 12px; border-radius: var(--r-full); font-size: var(--t-sm); color: var(--ink-3); transition: all var(--d-fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); font-weight: 500; }

.switch { width: 40px; height: 24px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); position: relative; transition: background var(--d) var(--e-out); flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 99px; background: var(--surface); box-shadow: var(--sh-1); transition: transform var(--d) var(--e-snap); }
.switch[aria-checked="true"] { background: var(--accent); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent-ink); }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--r-full);
  font-size: var(--t-sm); font-weight: 500; border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--sh-1); transition: transform var(--d-fast) var(--e-out), box-shadow var(--d-fast), border-color var(--d-fast);
  white-space: nowrap;
}
.btn:hover { box-shadow: var(--sh-2); border-color: var(--line-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: var(--t-xs); }
.btn:disabled { opacity: .5; cursor: default; pointer-events: none; }

.icon-btn { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--ink-2); transition: background var(--d-fast), color var(--d-fast); flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------------- pop / menu ---------------- */
.pop {
  position: fixed; z-index: 60; border-radius: var(--r-lg); background: var(--glass-bg-2);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--line-2);
  box-shadow: var(--sh-4), var(--glass-spec); overflow: hidden; animation: popin var(--d) var(--e-out) both;
  display: flex; flex-direction: column; min-height: 0;
}
@keyframes popin { from { opacity: 0; transform: translateY(-6px) scale(.985); } to { opacity: 1; transform: none; } }
.menu { padding: 5px; min-width: 176px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 9px; border-radius: 8px; font-size: var(--t-md); color: var(--ink-2); transition: background var(--d-fast), color var(--d-fast); }

/* ---------------- modal ---------------- */
.modal-scrim { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: var(--s4); background: rgba(16,14,11,.34); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fade var(--d) var(--e-out) both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(720px, 100%); max-height: min(86dvh, 720px); display: flex; flex-direction: column; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--sh-4); overflow: hidden; animation: popin var(--d-slow) var(--e-out) both; }
.modal.wide { width: min(920px, 100%); }

.modal-head h2 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.02em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-body { overflow-y: auto; padding: var(--s5) var(--s6); min-height: 0; }

/* ---------------- transcript (conversation inspector) ---------------- */
.tmsg { padding: 12px 14px; border-radius: var(--r-md); margin-bottom: 10px; font-size: var(--t-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
.tmsg.user { background: var(--surface-2); }
.tmsg.assistant { background: var(--surface); border: 1px solid var(--line); }

/* ---------------- misc ---------------- */
.empty-note { padding: 32px 16px; text-align: center; color: var(--ink-3); font-size: var(--t-sm); }
.skeleton { padding: 40px; text-align: center; color: var(--ink-3); font-size: var(--t-sm); }
kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--surface-2); }

.toasts { position: fixed; z-index: 90; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: var(--r-full); background: var(--glass-bg-2); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--line-2); box-shadow: var(--sh-3); font-size: var(--t-sm); animation: toastin var(--d) var(--e-out) both; pointer-events: auto; }
@keyframes toastin { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.toast[data-out="true"] { animation: toastout var(--d) var(--e-out) both; }

.toast svg { width: 15px; height: 15px; flex: none; }
.toast[data-kind="error"] svg { color: var(--bad); }
.toast[data-kind="ok"] svg { color: var(--good); }

.pager { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: var(--t-sm); color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }

/* ---- sidebar collapse + toggle visibility ----
   Kept LAST in the stylesheet and with higher specificity than .icon-btn's

<script>
/* ============================================================

const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtWhen = (t) => {
  if (!t) return '—';
  const d = (Date.now() - Number(t)) / 1000;
  if (d < 5) return 'just now';
  if (d < 60) return Math.floor(d) + 's ago';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 604800) return Math.floor(d / 86400) + 'd ago';
  return new Date(Number(t)).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};
const fmtDate = (t) => t ? new Date(Number(t)).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

const ICON = {
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

const svg = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ''}</svg>`;

function toast(msg, kind = 'info', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast'; el.dataset.kind = kind;
  el.innerHTML = (kind === 'ok' ? svg('check') : kind === 'error' ? svg('alert') : svg('info')) + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => { el.dataset.out = 'true'; setTimeout(() => el.remove(), 260); }, ms);
}

function confirmDialog(title, body, confirmLabel = 'Confirm', danger = true) {
  return new Promise((resolve) => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML = `<div class="modal" style="width:min(420px,100%)" role="alertdialog" aria-modal="true">
      <div class="modal-head"><h2>${esc(title)}</h2></div>
      <div class="modal-body"><p style="color:var(--ink-2);font-size:var(--t-md)">${esc(body)}</p>

          <button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(confirmLabel)}</button>
        </div>
      </div></div>`;
    document.body.append(scrim);
    const close = (val) => { scrim.remove(); resolve(val); };
    scrim.addEventListener('click', (e) => {
      if (e.target === scrim || e.target.closest('[data-no]')) close(false);
      if (e.target.closest('[data-yes]')) close(true);

    setTimeout(() => $('[data-yes]', scrim)?.focus(), 30);
  });

/* ---- lightweight popover menu, same pattern as the product app ---- */
window.Pop = {
  el: null,
  close() { if (this.el) { this.el.remove(); this.el = null; document.removeEventListener('pointerdown', this._out, true); } },
  menu(anchor, items) {
    this.close();
    const el = document.createElement('div');
    el.className = 'pop'; el.style.minWidth = '180px';
    el.innerHTML = `<div class="menu">${items.map((it) => it === '-' ? '<hr style="border:none;border-top:1px solid var(--line);margin:4px 2px">' :
      `<button data-act="${it.act}" class="${it.danger ? 'danger' : ''}">${svg(it.icon || 'chev')}${esc(it.label)}</button>`).join('')}</div>`;
    document.body.append(el);
    const r = anchor.getBoundingClientRect();
    el.style.position = 'fixed';
    let left = r.right - el.offsetWidth; left = Math.max(10, Math.min(left, innerWidth - el.offsetWidth - 10));
    let top = r.bottom + 6; if (top + el.offsetHeight > innerHeight - 10) top = r.top - el.offsetHeight - 6;
    el.style.left = left + 'px'; el.style.top = top + 'px';
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      this.close();
      items.find((i) => i.act === b.dataset.act)?.run?.();
    });
    this.el = el;
    this._out = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) this.close(); };
    document.addEventListener('pointerdown', this._out, true);
  },
};

/* ---- modal shell ---- */
function openModal(title, bodyHTML, { wide = false, onMount } = {}) {
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">${svg('x')}</button></div>
    <div class="modal-body">${bodyHTML}</div></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey, true);
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  onMount?.(scrim, close);
  return { el: scrim, close };
}
/* ============================================================
   SATURDAY ADMIN — auth & API client
   ============================================================ */
const AS = {
  get(k, fb) { try { const v = localStorage.getItem('saturday-admin:' + k); return v == null ? fb : JSON.parse(v); } catch { return fb; } },
  set(k, v) { try { localStorage.setItem('saturday-admin:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('saturday-admin:' + k); } catch {} },
};

window.Auth = {
  base() { return AS.get('base', ''); },
  token() { return AS.get('token', ''); },
  expiresAt() { return AS.get('expiresAt', 0); },

  isValid() { return !!this.token() && !!this.base() && Date.now() < this.expiresAt() - 5000; },

  async login(base, password) {
    const clean = base.trim().replace(/\/+$/, '');
    let res, body;
    try {
      res = await fetch(clean + '/api/admin/login', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password }),
      });
      body = await res.json().catch(() => ({}));
    } catch {
      throw new Error("Couldn't reach that URL. Check the address and that the API allows this origin (ALLOWED_ORIGINS).");
    }
    if (!res.ok) {
      if (res.status === 401) throw new Error('Incorrect password.');
      if (res.status === 429) throw new Error('Too many attempts. Wait a moment and try again.');
      if (res.status === 503) throw new Error(body.message || 'Admin login is not configured on this deployment yet.');
      throw new Error(body.message || `Sign-in failed (${res.status}).`);
    }
    AS.set('base', clean);
    AS.set('token', body.token);
    AS.set('expiresAt', Date.now() + (body.expiresIn || 0) * 1000);
    return true;
  },

  logout() { AS.del('token'); AS.del('expiresAt'); },
};

class ApiError extends Error {
  constructor(message, status, code) { super(message); this.status = status; this.code = code; }
}

window.Api = {
  async call(method, path, body) {
    if (!Auth.isValid()) { Auth.logout(); App.toLogin('Your session expired — sign in again.'); throw new ApiError('unauthorized', 401); }
    let res;
    try {
      res = await fetch(Auth.base() + path, {
        method,
        headers: { 'content-type': 'application/json', authorization: `Bearer ${Auth.token()}` },
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new ApiError('Network error reaching the Saturday API.', 0, 'network');
    }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    // A 401 means "the bearer token itself is invalid" only when the server says so with
    // error: 'unauthorized' — that's what a bad/expired admin session token produces.
    // Other endpoints (like change-password) also use 401 for their own reasons ("wrong
    // current password"), and those must NOT force a logout — the admin is still signed in.
    if (res.status === 401 && data.error === 'unauthorized') {
      Auth.logout(); App.toLogin('Your session expired — sign in again.');
      throw new ApiError('unauthorized', 401);
    }
    if (!res.ok) throw new ApiError(data.message || data.error || `Request failed (${res.status})`, res.status, data.error);
    return data;
  },
  get(path) { return this.call('GET', path); },
  post(path, body) { return this.call('POST', path, body ?? {}); },
  patch(path, body) { return this.call('PATCH', path, body ?? {}); },
  put(path, body) { return this.call('PUT', path, body ?? {}); },
  del(path) { return this.call('DELETE', path); },
};
/* ============================================================
   SATURDAY ADMIN — section views
   Every view fetches live data through Api and renders it; there
   is no mock state anywhere in this file.
   ============================================================ */
const SIGNALS = ['image input', 'code', 'mathematics', 'reasoning', 'structured output', 'long context', 'short turn'];
const TIERS = ['small', 'medium', 'large'];

function statusBadge(status) {
  const map = { available: 'good', degraded: 'warn', unavailable: 'bad', unknown: '' };
  return `<span class="dot" data-s="${status}"></span> <span class="badge ${map[status] || ''}" style="margin-left:6px">${esc(status)}</span>`;
}
function skeleton(el) { el.innerHTML = `<div class="skeleton">Loading…</div>`; }
/** A forced health check runs server-side in slices (25 per pass). Loop the
    passes so the whole catalogue really is checked — and so the toast can say
    "checked N" instead of "checked 0" whenever a cron window just ran. */
async function sweepAll(btn) {
  btn.disabled = true;
  let checked = 0, rounds = 0;
  try {
    while (rounds < 12) {
      const r = await Api.post('/api/admin/models/health-check', { force: true });
      checked += r.checked; rounds++;
      if (!r.checked || !r.skipped) break;
      toast(`Checked ${checked} so far — ${r.skipped} to go…`, 'info', 1800);
    }
    toast(checked ? `Health check complete — ${checked} models checked` : 'Everything was checked moments ago', 'ok');
  } catch (err) { toast(err.message, 'error'); }
  btn.disabled = false;
  App.go(App.current);
}

  if (retry) $('#retryBtn', el)?.addEventListener('click', retry);
}

        <span class="sp"></span><button class="btn primary" data-add>${svg('plus')}Add provider</button></div>
      <div class="card"><div class="table-wrap"><table class="dt">
        <thead><tr><th>Name</th><th>Base URL</th><th>Key</th><th>Enabled</th><th>Priority</th><th>Rate limit</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map((r) => {
          const c = cfgById.get(r.id) || { enabled: true, priority: 100 };
          return `<tr data-row="${r.id}">
            <td><b>${esc(r.name)}</b>${r.free_only ? ' <span class="badge accent">free only</span>' : ''}</td>
            <td class="mono wrap">${esc(r.base_url)}</td>
            <td class="mono">${esc(r.api_key)}</td>
            <td><button class="switch" role="switch" aria-checked="${c.enabled}" data-toggle="${r.id}"></button></td>
            <td><input class="tf numf" type="number" min="0" max="999" value="${c.priority}" data-priority="${r.id}"></td>
            <td class="mono" style="color:var(--ink-3)">see Rate limits</td>
            <td style="display:flex;gap:4px"><button class="icon-btn" data-edit="${r.id}" aria-label="Edit">${svg('edit')}</button><button class="icon-btn" data-del="${r.id}" aria-label="Delete">${svg('trash')}</button></td>
          </tr>`;
        }).join('') : `<tr><td colspan="7"><div class="empty-note">No custom providers yet. Add one to route through any OpenAI-compatible API.</div></td></tr>`}</tbody>
      </table></div></div>`;

    const form = (row) => `
      <div class="field"><div class="lab"><b>Name</b><span>Shown in the model picker.</span></div>
        <div class="ctl"><input class="tf" id="cp-name" value="${esc(row?.name || '')}" style="width:220px"></div></div>
      <div class="field"><div class="lab"><b>Base URL</b><span>The endpoint's OpenAI-compatible root, e.g. https://api.together.xyz/v1</span></div>
        <div class="ctl"><input class="tf" id="cp-url" value="${esc(row?.base_url || '')}" style="width:280px" placeholder="https://"></div></div>
      <div class="field"><div class="lab"><b>API key</b><span>${row ? 'Leave blank to keep the current key.' : 'Sent as a Bearer token; stored only in your database.'}</span></div>
        <div class="ctl"><input class="tf" id="cp-key" type="password" style="width:220px" placeholder="${row ? '••••••••' : 'sk-…'}"></div></div>
      <div class="field"><div class="lab"><b>Free models only</b><span>List only models this endpoint prices at $0, where it publishes pricing.</span></div>
        <div class="ctl"><button class="switch" role="switch" aria-checked="${row?.free_only ? 'true' : 'false'}" id="cp-free"></button></div></div>`;

    const openForm = (row) => {
      openModal(row ? 'Edit custom provider' : 'Add custom provider', form(row) +
        `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
          <button class="btn" data-cancel>Cancel</button><button class="btn primary" data-save>${row ? 'Save' : 'Add provider'}</button></div>`,
        { onMount: (scrim, close) => {
            scrim.querySelector('#cp-free').addEventListener('click', (e) => {
              e.target.setAttribute('aria-checked', String(e.target.getAttribute('aria-checked') !== 'true'));
            });
            scrim.querySelector('[data-cancel]').addEventListener('click', close);
            scrim.querySelector('[data-save]').addEventListener('click', async () => {
              const name = $('#cp-name', scrim).value.trim();
              const baseUrl = $('#cp-url', scrim).value.trim();
              const apiKey = $('#cp-key', scrim).value;
              const freeOnly = $('#cp-free', scrim).getAttribute('aria-checked') === 'true';
              if (!name || !baseUrl) return toast('Name and base URL are required', 'error');
              if (!row && !apiKey) return toast('An API key is required', 'error');
              try {
                if (row) await Api.patch(`/api/admin/custom-providers/${row.id}`, { name, baseUrl, freeOnly, ...(apiKey ? { apiKey } : {}) });
                else await Api.post('/api/admin/custom-providers', { name, baseUrl, apiKey, freeOnly });
                toast('Saved', 'ok'); close(); App.go(App.current);
              } catch (err) { toast(err.message, 'error'); }
            });
          } });
    };

    $('[data-add]', el).addEventListener('click', () => openForm(null));
    el.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-toggle]');
      if (t) {
        try {
          const next = t.getAttribute('aria-checked') !== 'true';
          await Api.patch(`/api/admin/providers/${t.dataset.toggle}`, { enabled: next });
          t.setAttribute('aria-checked', String(next));
        } catch (err) { toast(err.message, 'error'); }
        return;
      }
      const ed = e.target.closest('[data-edit]');
      if (ed) return openForm(rows.find((r) => r.id === ed.dataset.edit));
      const del = e.target.closest('[data-del]');
      if (del) {
        if (!(await confirmDialog('Delete this provider?', 'Its models disappear immediately. This cannot be undone.', 'Delete'))) return;
        try { await Api.del(`/api/admin/custom-providers/${del.dataset.del}`); toast('Deleted', 'ok'); App.go(App.current); }
        catch (err) { toast(err.message, 'error'); }
        return;
      }
      const pr = e.target.closest('[data-priority]');
      if (pr) return; // handled on change below
    });
    el.addEventListener('change', async (e) => {
      const pr = e.target.closest('[data-priority]');
      if (pr) {
        try { await Api.patch(`/api/admin/providers/${pr.dataset.priority}`, { priority: Number(pr.value) || 0 }); toast('Priority saved', 'ok'); }
        catch (err) { toast(err.message, 'error'); }
      }
    });
  },

  /* ============================================================ rate limits */
  async ['rate-limits'](el) {
    skeleton(el);
    let cfg, providers;
    try {
      [cfg, providers] = await Promise.all([
        Api.get('/api/admin/rate-limits'),
        Api.get('/api/admin/providers').then((r) => r.providers),
      ]);
    } catch (e) { return errCard(el, e, () => App.go(App.current)); }

    el.innerHTML = `
      <div class="section-head">
        <span class="desc">Two layers protect a public, login-free site: a per-visitor limit on the composer, and a global limit per AI provider that every visitor's requests share — so combined traffic can never exceed what a free key allows.</span></div>

      <div class="card"><div class="card-head"><h3>Per-visitor (by IP)</h3></div>
        <div class="card-body">
          <div class="field"><div class="lab"><b>Messages per minute</b><span>Composer sends beyond this get a "slow down" message.</span></div>
            <div class="ctl"><input class="tf numf" type="number" min="1" id="rl-chatmin" value="${cfg.chatPerMinutePerIP}"></div></div>
          <div class="field"><div class="lab"><b>Messages per day</b></div>
            <div class="ctl"><input class="tf numf" type="number" min="1" id="rl-chatday" value="${cfg.chatPerDayPerIP}"></div></div>
          <div class="field"><div class="lab"><b>Max message length (characters)</b><span>Longer requests are rejected before reaching any provider.</span></div>
            <div class="ctl"><input class="tf numf" type="number" min="500" id="rl-maxchars" value="${cfg.maxMessageChars}" style="width:96px"></div></div>
          <div class="field"><div class="lab"><b>General API requests per minute</b><span>Covers every route — model listing, search, etc.</span></div>
            <div class="ctl"><input class="tf numf" type="number" min="1" id="rl-general" value="${cfg.generalPerMinutePerIP}"></div></div>
        </div></div>

      <div class="card"><div class="card-head"><h3>Global, per provider</h3></div>
        <div class="card-body">
          <div class="field"><div class="lab"><b>Default limit</b><span>Used for any provider without its own row below.</span></div>
            <div class="ctl"><input class="tf numf" type="number" min="1" id="rl-provdefault" value="${cfg.providerPerMinuteDefault}"></div></div>
          ${providers.map((p) => `<div class="field"><div class="lab"><b>${esc(p.name)}</b><span class="mono">${esc(p.id)}</span></div>
            <div class="ctl"><input class="tf numf" type="number" min="1" data-prov-limit="${esc(p.id)}" value="${cfg.providerPerMinute[p.id] ?? ''}" placeholder="${cfg.providerPerMinuteDefault}"></div></div>`).join('')}
        </div></div>

      <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="rl-save">Save rate limits</button></div>`;

    $('#rl-save', el).addEventListener('click', async () => {
      const providerPerMinute = {};
      $$('[data-prov-limit]', el).forEach((inp) => { if (inp.value.trim()) providerPerMinute[inp.dataset.provLimit] = Number(inp.value); });
      const patch = {
        chatPerMinutePerIP: Number($('#rl-chatmin', el).value) || 1,
        chatPerDayPerIP: Number($('#rl-chatday', el).value) || 1,
        maxMessageChars: Number($('#rl-maxchars', el).value) || 500,
        generalPerMinutePerIP: Number($('#rl-general', el).value) || 1,
        providerPerMinuteDefault: Number($('#rl-provdefault', el).value) || 1,
        providerPerMinute,
      };
      try { await Api.patch('/api/admin/rate-limits', patch); toast('Rate limits saved', 'ok'); App.go(App.current); }
      catch (err) { toast(err.message, 'error'); }
    });
  },

    const suggRow = (s, i) => `<div style="display:flex;gap:6px;margin-bottom:6px" data-sugg-row>

          <div class="field"><div class="lab"><b>Tagline</b></div>
            <div class="ctl"><input class="tf" id="br-tagline" value="${esc(site.branding.tagline)}" style="width:280px"></div></div>

          <div class="field" style="align-items:flex-start"><div class="lab"><b>Logo mark</b><span>Leave blank for the default icon. Paste raw &lt;svg&gt;…&lt;/svg&gt; markup, or an https:// image URL.</span></div>
            <div class="ctl" style="flex:1"><textarea class="tf" id="br-mark" rows="3" style="width:100%">${esc(site.branding.mark)}</textarea></div></div>
        </div></div>

      <div class="card"><div class="card-head"><h3>Welcome screen</h3></div>
        <div class="card-body">
          <div class="field"><div class="lab"><b>Heading</b></div><div class="ctl"><input class="tf" id="br-heading" value="${esc(site.welcome.heading)}" style="width:220px"></div></div>

        <div class="card-body">
          <div class="field"><div class="lab"><b>Placeholder text</b></div><div class="ctl"><input class="tf" id="br-placeholder" value="${esc(site.composer.placeholder)}" style="width:280px"></div></div>
        </div></div>

      <div class="card"><div class="card-head"><h3>Announcement banner</h3></div>
        <div class="card-body">
          <div class="field"><div class="lab"><b>Show a banner</b><span>A dismissible bar under the header.</span></div>
            <div class="ctl"><button class="switch" role="switch" aria-checked="${site.announcement.enabled}" id="br-announce-on"></button></div></div>
          <div class="field"><div class="lab"><b>Text</b></div><div class="ctl"><input class="tf" id="br-announce-text" value="${esc(site.announcement.text)}" style="width:320px"></div></div>
        </div></div>

      <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="br-save">Save all</button></div>`;

    $('#br-announce-on', el).addEventListener('click', (e) => e.target.setAttribute('aria-checked', String(e.target.getAttribute('aria-checked') !== 'true')));
    $('#br-add-sugg', el).addEventListener('click', () => { $('#br-suggs', el).insertAdjacentHTML('beforeend', suggRow('', 0)); });
    $('#br-suggs', el).addEventListener('click', (e) => { if (e.target.closest('[data-remove-sugg]')) e.target.closest('[data-sugg-row]').remove(); });

    $('#br-save', el).addEventListener('click', async () => {
      const suggestions = $$('[data-sugg-input]', el).map((i) => i.value.trim()).filter(Boolean);
      const branding = { name: $('#br-name', el).value.trim(), tagline: $('#br-tagline', el).value.trim(), favicon: $('#br-favicon', el).value.trim(), mark: $('#br-mark', el).value.trim() };
      const welcome = { heading: $('#br-heading', el).value.trim(), subheading: $('#br-subheading', el).value.trim(), suggestions };
      const composer = { placeholder: $('#br-placeholder', el).value.trim() };
      const announcement = { enabled: $('#br-announce-on', el).getAttribute('aria-checked') === 'true', text: $('#br-announce-text', el).value.trim() };
      try {
        await Promise.all([
          Api.put('/api/admin/cms/site.branding', { value: branding }),
          Api.put('/api/admin/cms/site.welcome', { value: welcome }),
          Api.put('/api/admin/cms/site.composer', { value: composer }),
          Api.put('/api/admin/cms/site.announcement', { value: announcement }),
        ]);
        toast('Saved — visitors see it on their next load', 'ok');
      } catch (err) { toast(err.message, 'error'); }
    });
  },

  /* ============================================================ CMS */
  async cms(el) {
    skeleton(el);
    let rows;
    try { rows = (await Api.get('/api/admin/cms')).content; }
    catch (e) { return errCard(el, e, () => App.go(App.current)); }

    el.innerHTML = `<div class="section-head"><span class="desc">Anything not covered by Branding & content — arbitrary key/value pairs the product (or your own integrations) can read from <span class="mono">/api/cms</span>.</span>
      <span class="sp"></span><button class="btn primary" data-add>${svg('plus')}Add key</button></div>
      <div style="display:grid;gap:12px">${rows.filter((r) => !r.key.startsWith('site.')).map((r) => this.cmsCard(r)).join('') || '<div class="card"><div class="card-body"><div class="empty-note">No custom content yet.</div></div></div>'}</div>`;

    el.addEventListener('click', async (e) => {
      if (e.target.closest('[data-add]')) {
        const key = prompt('Content key (e.g. footer.text, faq, changelog):');
        if (!key) return;
        if (key.trim().startsWith('site.')) return toast('Keys starting with "site." are managed from Branding & content', 'error');
        try { await Api.put(`/api/admin/cms/${encodeURIComponent(key.trim())}`, { value: '' }); App.go(App.current); }
        catch (err) { toast(err.message, 'error'); }
        return;
      }
      const save = e.target.closest('[data-save-cms]');
      if (save) {
        const key = save.dataset.saveCms;
        const raw = $(`[data-cms-value="${key}"]`, el).value;
        let value = raw; try { value = JSON.parse(raw); } catch { /* plain string is fine too */ }
        try { await Api.put(`/api/admin/cms/${encodeURIComponent(key)}`, { value }); toast('Saved', 'ok'); }
        catch (err) { toast(err.message, 'error'); }
        return;
      }
      const del = e.target.closest('[data-del-cms]');
      if (del) {
        if (!(await confirmDialog('Delete this content key?', 'The product will fall back to its built-in default.', 'Delete'))) return;
        try { await Api.del(`/api/admin/cms/${encodeURIComponent(del.dataset.delCms)}`); toast('Deleted', 'ok'); App.go(App.current); }
        catch (err) { toast(err.message, 'error'); }
      }
    });
  },
  cmsCard(row) {
    const pretty = (() => { try { return JSON.stringify(JSON.parse(row.value), null, 2); } catch { return row.value; } })();
    return `<div class="card"><div class="card-head"><h3 class="mono">${esc(row.key)}</h3><span class="sp"></span>
      <span style="font-size:var(--t-xs);color:var(--ink-3)">updated ${fmtWhen(row.updated_at)}</span>
      <button class="icon-btn" data-del-cms="${esc(row.key)}">${svg('trash')}</button></div>
      <div class="card-body"><textarea class="tf" rows="5" data-cms-value="${esc(row.key)}">${esc(pretty)}</textarea>
      <div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn sm primary" data-save-cms="${esc(row.key)}">Save</button></div></div></div>`;
  },

        catch (err) { toast(err.message, 'error'); }
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        if (!(await confirmDialog('Delete this flag?', 'This cannot be undone.', 'Delete'))) return;
        try { await Api.del(`/api/admin/flags/${encodeURIComponent(del.dataset.del)}`); toast('Deleted', 'ok'); App.go(App.current); }

      }

          <div class="field"><div class="lab"><b>API base</b></div><div class="ctl mono">${esc(Auth.base())}</div></div>
          <div class="field"><div class="lab"><b>Token expires</b></div><div class="ctl">${fmtDate(Auth.expiresAt())}</div></div>
        </div></div>`;

    $('#maintSwitch', el).addEventListener('click', (e) => {
      const next = e.target.getAttribute('aria-checked') !== 'true';
      e.target.setAttribute('aria-checked', String(next));
    });
    $('#maintSave', el).addEventListener('click', async () => {
      const enabled = $('#maintSwitch', el).getAttribute('aria-checked') === 'true';
      const message = $('#maintMsg', el).value.trim();
      try { await Api.patch('/api/admin/system/maintenance', { enabled, message }); toast('Saved', 'ok'); App.pollMaintenance(); }
      catch (err) { toast(err.message, 'error'); }
    });
    $('#pwSave', el).addEventListener('click', async () => {
      const currentPassword = $('#pwCurrent', el).value;
      const newPassword = $('#pwNew', el).value;
      if (!currentPassword || !newPassword) return toast('Both fields are required', 'error');
      if (newPassword.length < 8) return toast('New password must be at least 8 characters', 'error');
      try {
        await Api.post('/api/admin/change-password', { currentPassword, newPassword });
        toast('Password changed', 'ok');
        App.go(App.current);
      } catch (err) { toast(err.message, 'error'); }
    });
  },
};
/* ============================================================
   SATURDAY ADMIN — app shell: nav, routing, login, boot
   ============================================================ */
const NAV = [
  { id: 'overview', label: 'Overview', icon: 'overview' },
  { id: 'providers', label: 'Providers', icon: 'providers' },
  { id: 'custom-providers', label: 'Custom providers', icon: 'key' },
  { id: 'models', label: 'Models', icon: 'models' },
  { id: 'routing', label: 'Routing', icon: 'routing' },
  { id: 'rate-limits', label: 'Rate limits', icon: 'power' },
  { divider: true, label: 'Content' },
  { id: 'branding', label: 'Branding & content', icon: 'cms' },
  { id: 'users', label: 'Users', icon: 'users' },
  { id: 'conversations', label: 'Conversations', icon: 'conversations' },
  { id: 'cms', label: 'Custom content', icon: 'cms' },
  { id: 'flags', label: 'Feature flags', icon: 'flags' },
  { divider: true, label: 'System' },
  { id: 'audit', label: 'Audit log', icon: 'audit' },
  { id: 'settings', label: 'System', icon: 'settings' },
];
const TITLES = { overview: ['Overview', 'How Saturday is doing right now'], providers: ['Providers', 'Enable, disable and prioritize AI providers'],
  'custom-providers': ['Custom providers', 'Any OpenAI-compatible endpoint, with its own key'],
  'rate-limits': ['Rate limits', 'Keep public traffic from exceeding a provider quota'],
  branding: ['Branding & content', 'Every visitor-facing text, icon and image'],
  models: ['Models', 'Everything discovered across your providers'], routing: ['Routing', 'Bias Smart Router with rules'],
  users: ['Users', 'Everyone who has talked to Saturday'], conversations: ['Conversations', 'Search, inspect and moderate'],
  cms: ['Custom content', 'Landing copy and announcements'], flags: ['Feature flags', 'Gradual rollouts, no deploy needed'],
  audit: ['Audit log', 'Every admin action'], settings: ['System', 'Maintenance mode and your admin password'] };

window.App = {
  current: null,
  maintTimer: null,

  toLogin(message) {
    $('#shell').classList.remove('show');
    $('#loginView').style.display = 'grid';
    if (message) this.loginError(message);
    clearInterval(this.maintTimer);
  },

  loginError(msg) {
    const box = $('#loginErr');
    $('#loginErrText').textContent = msg;
    box.classList.add('show');
  },

  renderNav() {
    $('#navList').innerHTML = NAV.map((item) => item.divider
      ? `<div class="nav-label">${esc(item.label)}</div>`
      : `<button class="nav-item" data-nav="${item.id}" aria-current="${this.current === item.id}">${svg(item.icon)}<span>${esc(item.label)}</span></button>`
    ).join('');
  },

  async go(id) {
    this.current = id;
    this.renderNav();
    const [title, sub] = TITLES[id] || [id, ''];
    $('#viewTitle').textContent = title;
    $('#viewSub').textContent = sub;
    location.hash = id;
    if (innerWidth <= 900) $('#shell').dataset.nav = 'closed';
    // Every view attaches its own click/change listeners to this element. Without
    // a fresh node per navigation, listeners from every view ever visited would
    // stack up on the same element for the rest of the session — so a click in
    // one section could also fire stale handlers left behind by another.
    const old = $('#viewBody');
    const fresh = old.cloneNode(false);
    old.replaceWith(fresh);
    await Views[id](fresh);
  },

  async pollMaintenance() {
    try {
      const m = await Api.get('/api/admin/system/maintenance');
      $('#maintBanner').classList.toggle('show', !!m.enabled);
      if (m.enabled) $('#maintText').textContent = `Maintenance mode is on${m.message ? ': "' + m.message + '"' : ''} — the product is showing this to users.`;
    } catch { /* transient — next poll will catch up */ }
  },

  async enterShell() {
    $('#loginView').style.display = 'none';
    $('#shell').classList.add('show');
    $('#envLabel').textContent = Auth.base().replace(/^https?:\/\//, '');
    try { await Api.get('/api/health'); $('#envDot').dataset.s = 'available'; }
    catch { $('#envDot').dataset.s = 'unavailable'; }
    this.renderNav();
    const initial = (location.hash || '').replace('#', '') || 'overview';
    await this.go(NAV.some((n) => n.id === initial) ? initial : 'overview');
    this.pollMaintenance();
    this.maintTimer = setInterval(() => this.pollMaintenance(), 30000);
  },

  bind() {
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#loginErr').classList.remove('show');
      const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        await Auth.login($('#apiBaseField').value, $('#passwordField').value);
        $('#passwordField').value = '';
        await this.enterShell();
      } catch (err) {
        this.loginError(err.message);
      }
      btn.disabled = false; btn.textContent = 'Sign in';
    });

    $('#logoutBtn').addEventListener('click', () => { Auth.logout(); this.toLogin(); });
    /* Same sidebar collapse the chat app has: desktop collapses the rail (state
       persists), mobile slides the drawer. The button always does something. */
    const toggleNav = () => {
      const shell = $('#shell');
      if (innerWidth <= 900) { shell.dataset.nav = shell.dataset.nav === 'open' ? 'closed' : 'open'; return; }
      AS.set('rail', shell.dataset.rail === 'collapsed' ? 'open' : 'collapsed');
      this.syncNav();
    };
    $('#navToggle').addEventListener('click', toggleNav);
    $('#navCollapse').addEventListener('click', toggleNav);
    $('#navScrim').addEventListener('click', () => { $('#shell').dataset.nav = 'closed'; });
    addEventListener('resize', debounce(() => this.syncNav(), 120));
    $('#navList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-nav]'); if (b) this.go(b.dataset.nav);
    });
    addEventListener('hashchange', () => {
      const id = (location.hash || '').replace('#', '');
      if (id && id !== this.current && NAV.some((n) => n.id === id)) this.go(id);
    });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') Pop.close(); });
  },

  syncNav() {
    const shell = $('#shell');
    if (innerWidth <= 900) { shell.dataset.rail = 'open'; return; } // mobile uses the drawer, never the collapsed rail
    shell.dataset.rail = AS.get('rail', 'open');
  },

  async start() {
    this.bind();
    this.syncNav();
    // Prefill the base URL: the remembered one from a previous session wins;
    // served same-origin by the Worker, this page's own origin is the right default.
    $('#apiBaseField').value = Auth.base()
      || (location.protocol.startsWith('http') ? location.origin : '');
    if (Auth.isValid()) { try { await this.enterShell(); } catch { Auth.logout(); this.toLogin(); } }
  },
};

document.addEventListener('DOMContentLoaded', () => App.start());
if (document.readyState !== 'loading') App.start();
</script>
</body>
</html>
